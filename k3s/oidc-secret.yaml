# Secret denpa-oidc (issuer / client-id / client-secret / group) は Infisical
# (il.doany.io) が持ち、External Secrets Operator がフォルダ /denpa/denpa-oidc の
# 中身をそのままキーにして作る。値の変更は Infisical 側で行い、Git には何も入れない
# (danything/bootstrap の README 参照)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: denpa-oidc
  namespace: denpa
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: denpa-oidc
  dataFrom:
    - find:
        path: /denpa/denpa-oidc
        name:
          regexp: .*
