# ArgoCD の CreateNamespace でも作れるが、**Namespace は明示的に持つ。**
# argocd.yaml の namespace はあくまで Application の行き先で、
# ここは中身 (PVC = 録画) を入れる箱そのもの。
#
# **消させない。** Argo は追跡から外れたリソースを prune するが、Namespace の
# 削除は中の PVC (録画 1TB) ごと巻き込む。このファイルを消しても実体は残る
apiVersion: v1
kind: Namespace
metadata:
  name: denpa
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
