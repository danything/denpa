{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.from }}
{{- fail "networkPolicy.enabled にしたら networkPolicy.from に denpa のいる所を書きます (values.yaml)" }}
{{- end }}
# エージェントへは networkPolicy.from に書いた相手からだけ繋がせる (values.yaml の networkPolicy)。
# エージェントは認証を持たず、/denpa/stream は復号済みの TS を返す (docs/agent.md「エージェントは認証を持たない」)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tuner-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "denpa-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: tuner-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: 25252
{{- end }}
