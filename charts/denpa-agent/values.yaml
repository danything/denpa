# tuner-agent 単体の既定値。**denpa 本体は入っていない。**
#
# チューナーとカードリーダーを挿した機械にだけこれを置き、denpa 本体は
# 別の所で動かす構成向け (denpa 側は TUNER_AGENT_URL でここを指す)。
# 本体も同じクラスタに置くなら、charts/denpa がエージェントも一緒に出す。
#
# **掛かったまま録れた TS を後から復号するには、denpa と同じ置き場が見えている必要がある**
# (persistence.raw)。別の機械で動かすなら NFS などで同じ実体を両方に見せる。
# 見せられなくても録画中はその場で復号するので、困るのは録画中にカードが読めなかった
# ときだけ (docs/tuners.md「B-CASカードとデスクランブル」)

image:
  repository: ghcr.io/danything/denpa-agent
  tag: latest
  pullPolicy: Always

# 入れ替えの合図 (charts/denpa の imageMarks と同じ)。固定タグなら空でよい
imageMark: ""

# チューナーとカードリーダーに触るために特権が要る。PX-Q3U4 などはホストにドライバを
# 入れず、/dev/bus (USB) が見えればイメージ同梱の px4-userland が扱う (docs/tuner-px4.md)
privileged: true
hostDevices:
  - name: dev-bus
    path: /dev/bus
  - name: dev-dvb
    path: /dev/dvb
# 録画中に入れ替えが来たら、終わるまで居座ってから止まる
terminationGracePeriodSeconds: 21900
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  storageClassName: ""
  # **PVC を ArgoCD に消させない** (Prune=false,Delete=false)。既定は true で、
  # true の間は chart から PVC が消えても・Application ごと消しても ArgoCD は触らない。
  # **false にすると「git で消したものは実際に消える」。** マニフェストから外れた
  # 時点でボリュームごと消えるので、バックアップを用意してからにすること
  protectFromPruning: true
  # エージェントの設定 (tuners.json / channels.json)
  config:
    size: 128Mi
    existingClaim: ""
  # denpa の元のTSの置き場。**denpa と同じ実体を見せる** (上の説明)。
  # existingClaim に denpa 側の PVC を渡す。空なら chart が自分の分を作る
  # (= 別の機械で動かしていて共有できない構成)
  raw:
    size: 300Gi
    existingClaim: ""

service:
  # 選局・スクランブルの復号の API。denpa の TUNER_AGENT_URL がここを指す
  port: 25252
  type: ClusterIP
  # 別のクラスタ/機械の denpa から届かせるなら NodePort か LoadBalancer にする。
  # **エージェントは認証を持たない** (/denpa/stream は復号済みの TS を返す)。開くのは世帯の中の
  # LAN までにして、インターネットや世帯の外へは出さない (docs/agent.md「エージェントは認証を持たない」)。
  # 下の networkPolicy で繋げる相手も絞れる
  nodePort: null

# **エージェントが答えてよい名前** (AGENT_ALLOWED_HOSTS。カンマ区切り、頭にドットでその下の名前全部)。
# 知らない名前で呼ばれると 403 で断る (DNS リバインディングを防ぐ。docs/agent.md「エージェントは認証を持たない」)。
# IP の直書き・tuner-agent・tuner-agent.<名前空間>.svc(.cluster.local)・.local などは書かなくても通るので、
# denpa の TUNER_AGENT_URL をそれ以外の名前 (持っているドメインの名前など) で書くときだけ足す
allowedHosts: ""

# **エージェントに繋げる相手を絞る** NetworkPolicy を出す。CNI が NetworkPolicy に対応していないと、
# 出しても効かない。オンにしたら from に denpa のいる所を書く (NetworkPolicyPeer の並び。
# そのまま ingress の from に入る)。同じクラスタの別の名前空間なら namespaceSelector と podSelector、
# クラスタの外の denpa なら ipBlock。NodePort・LoadBalancer 越しだと送り元のアドレスがノードのものに
# 書き換わる (externalTrafficPolicy が既定の Cluster のとき) ので、ipBlock にはそれも入れる
networkPolicy:
  enabled: false
  from: []
  # - namespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: denpa
  #   podSelector:
  #     matchLabels:
  #       app: denpa
  # - ipBlock:
  #     cidr: 192.168.1.10/32
