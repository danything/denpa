# チューナーエージェント。**機材に触るのはここだけ。**
# 選局・チャンネルスキャン・B-CASカード・スクランブル解除を持ち、
# 素のTSを denpa へ流す (番組表を読むのは denpa の仕事)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuner-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "denpa.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tuner-agent
  template:
    metadata:
      labels:
        app: tuner-agent
      {{- with .Values.imageMarks.agent }}
      annotations:
        # 入れ替えの合図 (values.yaml の imageMarks)
        denpa.doany.io/agent-image: {{ . | quote }}
      {{- end }}
    spec:
      # 録画中に入れ替えが来たら、終わるまで居座ってから止まる (SHUTDOWN_WAIT)。
      # 既定 (30秒) のままだと Pod を入れ替えるだけで TS が切れる
      terminationGracePeriodSeconds: {{ .Values.agent.terminationGracePeriodSeconds }}
      containers:
        - name: tuner-agent
          image: "{{ .Values.image.agent.repository }}:{{ .Values.image.agent.tag }}"
          imagePullPolicy: {{ .Values.image.agent.pullPolicy }}
          securityContext:
            privileged: {{ .Values.agent.privileged }}
          env:
            - name: TZ
              value: {{ .Values.agent.timezone | quote }}
            # 掛かったまま録れたTSを解く先。denpa の置き場と同じ実体
            - name: RECORDED_DIR
              value: /denpa-recorded
          ports:
            - containerPort: 25252
          volumeMounts:
            - name: agent-config
              mountPath: /app-config
            - name: denpa-recorded
              mountPath: /denpa-recorded
            {{- range .Values.agent.hostDevices }}
            - name: {{ .name }}
              mountPath: {{ .path }}
            {{- end }}
          {{- with .Values.agent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: agent-config
          persistentVolumeClaim:
            claimName: {{ include "denpa.pvcName" (dict "Values" .Values "key" "agentConfig" "name" "agent-config") }}
        - name: denpa-recorded
          persistentVolumeClaim:
            claimName: {{ include "denpa.pvcName" (dict "Values" .Values "key" "recorded" "name" "denpa-recorded") }}
        {{- range .Values.agent.hostDevices }}
        - name: {{ .name }}
          hostPath:
            path: {{ .path }}
            type: Directory
        {{- end }}
