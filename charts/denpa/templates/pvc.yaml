{{- /*
置き場。既定では **ArgoCD に消させない** (Prune=false,Delete=false)。ここが消えると録画が消える。
外すかどうかは persistence.protectFromPruning (values.yaml に理由つきで書いてある)。
existingClaim を渡したものは作らない
*/ -}}
{{- $root := . -}}
{{- /*
バックアップは PVC ごとのスナップショット (VolSync) で、どれを取るかは chart ではなく
クラスタ側が決める (danything/gitops の deploy/volsync/application.yaml)。
DB の SQLite は WAL なので、スナップショットから自分で立ち直る
*/ -}}
{{- range $item := list
    (dict "key" "agentConfig" "name" "agent-config"
          "note" "エージェントの設定 (tuners.json / channels.json)。denpa の画面から書く")
    (dict "key" "data" "name" "denpa-data"
          "note" "denpa の DB と logos/")
    (dict "key" "raw" "name" "denpa-raw"
          "note" "元のTSの作業領域。エンコードが終われば消える。容量が大きく数時間で入れ替わるので取らない")
    (dict "key" "encoded" "name" "denpa-encoded"
          "note" "エンコード済みの置き場。denpa がここから配り、削除も denpa がやる")
}}
{{- $p := index $root.Values.persistence $item.key }}
{{- if not $p.existingClaim }}
---
# {{ $item.note }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $item.name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "denpa.labels" $root | nindent 4 }}
  annotations:
    {{- if $root.Values.persistence.protectFromPruning }}
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    {{- end }}
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with $root.Values.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size }}
  {{- with $p.dataSourceRef }}
  # 作るときに中身を埋める (VolSync の populator など)。PVC の spec は作ったあと変えられないので、今ある PVC には効かない
  dataSourceRef:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
