# エージェントと組むときの合言葉 (docs/agent.md)。エージェントには AGENT_PAIR_TOKEN、denpa には
# TUNER_AGENT_URL の #pair= で同じものを渡す。中身は chart が作り、上げ直しても変えない (_helpers.tpl の denpa.pairToken)
apiVersion: v1
kind: Secret
metadata:
  name: tuner-agent-pair
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "denpa.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ include "denpa.pairToken" . | b64enc | quote }}
