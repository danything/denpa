{{- if .Values.prepull.enabled }}
# 新しいイメージを入れ替える前にノードへ引いておくだけの Job (ArgoCD の PreSync)。
# 理由は values.yaml の prepull。denpa は起こさない (`bun --version` で終わる。土台は distroless で
# シェルも /bin/true も無いので、イメージにある bun を使う)
apiVersion: batch/v1
kind: Job
metadata:
  name: denpa-prepull
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "denpa.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: prepull
          image: "{{ .Values.image.denpa.repository }}:{{ .Values.image.denpa.tag }}"
          # 必ず取りに行かせる。IfNotPresent だと古いものが残っているかぎり引かない
          imagePullPolicy: Always
          command: ['/usr/local/bin/bun', '--version']
{{- end }}
