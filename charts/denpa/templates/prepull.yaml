{{- if .Values.prepull.enabled }}
# 新しいイメージを入れ替える前にノードへ引いておくだけの Job (ArgoCD の PreSync)。
# 理由は values.yaml の prepull。中身は動かさない (/bin/true)
apiVersion: batch/v1
kind: Job
metadata:
  name: denpa-prepull
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "denpa.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: prepull
          image: "{{ .Values.image.denpa.repository }}:{{ .Values.image.denpa.tag }}"
          # 必ず取りに行かせる。IfNotPresent だと古いものが残っているかぎり引かない
          imagePullPolicy: Always
          command: ['/bin/true']
{{- end }}
