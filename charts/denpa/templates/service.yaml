apiVersion: v1
kind: Service
metadata:
  name: tuner-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "denpa.labels" . | nindent 4 }}
spec:
  selector:
    app: tuner-agent
  ports:
    # 選局もスキャンもスクランブル解除もここ1つ。中身は素のTSと小さなJSON
    - name: agent
      port: 25252
      targetPort: 25252
---
apiVersion: v1
kind: Service
metadata:
  name: denpa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "denpa.labels" . | nindent 4 }}
spec:
  # 止まりかけの Pod にも回す (values.yaml の service.publishNotReadyAddresses)
  publishNotReadyAddresses: {{ .Values.service.publishNotReadyAddresses }}
  selector:
    app: denpa
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 3000
