{{- if .Values.agent.networkPolicy.enabled }}
# エージェントへは denpa の Pod からだけ繋がせる (values.yaml の agent.networkPolicy)。
# エージェントは組んだ denpa にしか答えないが、届く相手も絞る (docs/agent.md)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tuner-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "denpa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: tuner-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: denpa
      ports:
        - protocol: TCP
          port: 25252
{{- end }}
