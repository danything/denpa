# 整形 (`bun fmt`。`package.json` の format・lint から呼ぶ)。書き方は既定のまま、外すものだけ
[fmt]
# import を並べ替える (副作用だけの import は順を変えない)
sortImports = true
ignorePatterns = [
  "deploy/",
  # Helm のテンプレートは Go のテンプレートで、YAML として読めない
  "charts/*/templates/",
  # drizzle-kit が出すマイグレーション (SQL と snapshot の JSON)。手では触らない
  "drizzle/",
  "renovate.json",
  # 文書サイトの公開物 (Search Console の確認用の HTML。Google が決めた中身のまま置く)
  "site/public/",
  # 区点と突き合わせる表
  "src/lib/ts/b24-tables.ts",
]
