<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <!-- ホーム画面に置いてアプリのように開けるようにする -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <meta name="theme-color" content="#1d232a" />
        <meta name="mobile-web-app-capable" content="yes" />
        <title>denpa</title>
        <script>
            // ハイドレーションを待つと一瞬ちがう色で表示されてしまうので、ここで当てる。
            // 保存が無ければ端末の設定に従う
            (() => {
                const saved = localStorage.getItem('theme');
                const mode = saved === 'light' || saved === 'dark' ? saved : 'system';
                const dark =
                    mode === 'dark' ||
                    (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
                document.documentElement.dataset.themeMode = mode;
            })();
        </script>
        <script>
            // 画面の高さ。**描く前に測る。**
            //
            // CSS の単位 (`100dvh`) が画面の高さと一致しない端末がある
            // (実機の PWA で、土台がアドレスバー1本ぶん = 56px 高くなった)。
            // ハイドレーションを待って測ると、**その前に一度はみ出したものが
            // 描かれて見える**。色を先に当てているのと同じ理由でここに置く
            document.documentElement.style.setProperty(
                '--app-h',
                `${document.documentElement.clientHeight || innerHeight}px`,
            );
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
