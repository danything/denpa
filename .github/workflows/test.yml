name: Test denpa

on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"
      - "docs/**"
      - "**.md"
  # PR はパスで絞らない。main は `check` を必須にして守っているので、絞ると
  # docs だけの PR に check が付かず、いつまでもマージできない
  # (paths-ignore で飛ばした workflow の check は「保留」のまま残る仕様)
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: test-denpa-${{ github.ref }}
  cancel-in-progress: true

# 本番コンテナは TZ=Asia/Tokyo で動く。放送日や番組表の日付はローカル時刻で
# 組み立てるので、ランナー既定のUTCのままだとテストが本番と違う値を見ることになる
env:
  TZ: Asia/Tokyo

# **ジョブに割って同時に流します。**
#
# 1本に並べていた頃は 4分37秒 で、そのうち 181秒 が E2E でした。他は全部
# 合わせても1分ありません。待っているのは**いちばん遅い1つ**だけでよいので、
# 中身の関係ないものを、それぞれ別のランナーに出しています。
#
# E2E はさらに5つに割ります (組分けは tests/e2e/shards.json)。ランナーは4コアで
# 1台3ワーカー (playwright.config.ts) なので、5台で15ワーカーぶん並びます
# (中身は待ち時間が大半なので、割った分だけ効く。
# docs/development.md「並べて流す」)。
jobs:
  # リント・型・単体。**いちばん早く赤くなるところ**なので、先に見えるように分ける
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 開発は compose 前提だが、CIでイメージを組むと数分かかるうえ
      # ffmpeg も実チューナーも要らない(テストは全部偽物を使う)ので、
      # ランナーに直接 bun を入れて回す。
      # bun のバージョンは Dockerfile と食い違わないよう、そこから読む
      - name: Read bun version from Dockerfile
        id: bun
        run: echo "version=$(grep -oP 'oven/bun:\K[^-\s]+' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint

      - name: Type check
        run: bun run check

      # schema.ts を変えたのに `bun run db:generate` を回していないと、型と DB が
      # 食い違ったまま出ていく。ここで出し直して、何も増えないことを見る
      - name: Migrations are up to date with schema.ts
        run: |
          bun run db:generate
          git add -N drizzle
          git diff --exit-code --stat -- drizzle

      # denpa 本体だけ。エージェントは .NET なので下の agent ジョブで見る
      # (`agent/conformance.test.ts` はビルドした実行ファイルが要るので、ここには入れない)
      - name: Unit tests
        run: bun run test:unit

  # チューナーエージェント (.NET)。設定の読み書き・選局表と、API への適合テスト
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read bun version from Dockerfile
        id: bun
        run: echo "version=$(grep -oP 'oven/bun:\K[^-\s]+' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"

      # 設定の読み書き、選局表、チューナー自動検出の値の読み取り。
      # MTP の方式 (global.json の test.runner) ではプロジェクトは --project で渡す
      - name: Unit tests (.NET agent)
        # 通ったテストの出力も出す (Px4StreamBenchTests の数字を残すため)
        run: dotnet test --project agent/Denpa.Agent.Tests/Denpa.Agent.Tests.csproj --output detailed

      # エージェントの API に直接当てるテスト。**本物をビルドして起こして**、偽の選局
      # コマンドで流す (bun で書いたものがあった頃は、同じものを2つの実装に通していた)。
      # ビルドするところまで含めて1つの script にしてある — 手元で走らせるときに
      # ビルドし忘れると、消えた既定の置き場を読みに行って ENOENT で落ちるだけになる
      - name: Conformance
        run: bun run test:conformance

  # asicen-userland (PX-W3U3。試験的) の模擬の asicend と話す。上流はまだリリースが無いので、
  # 決めたコミットを手元で組んで `asicend --mock` を起こす (AsicenMockTests。機材にもファームウェアにも
  # 触らない)。**必須チェックにはしない** (上流の取得と組み立てで揺れる・必須の context を増やさない)。
  # 0.1.0 が出たら配布物を取る方式に替える (docs/tuners.md)
  agent-asicen-mock:
    runs-on: ubuntu-latest
    env:
      ASICEN_USERLAND_REF: 2718916cce028055290d5561ffde2df2d0153312
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout asicen-userland
        uses: actions/checkout@v7
        with:
          repository: Khronos31/asicen-userland
          ref: ${{ env.ASICEN_USERLAND_REF }}
          path: asicen-userland

      - name: Build asicen-userland (mock)
        run: |
          sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libusb-1.0-0-dev
          cmake -S asicen-userland -B asicen-build -DCMAKE_BUILD_TYPE=Release
          cmake --build asicen-build --parallel 4 --target asicend asicenctl

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"

      - name: Unit tests (.NET agent, asicend --mock)
        run: ASICEN_USERLAND_DIR="$PWD/asicen-build" dotnet test --project agent/Denpa.Agent.Tests/Denpa.Agent.Tests.csproj --treenode-filter '/*/*/AsicenMockTests/*'

  # 入れ方 (install.sh) を Linux で通しで。compose.prod.yml を置いて、本物のイメージを引いて起こし、
  # denpa が答えるまで。最後に外す。**必須チェックにはしない** (イメージを引くので重く、
  # レジストリの機嫌でも揺れる)。compose ファイルはこのコミットのものを取らせる (DENPA_VERSION)
  install-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint install.sh
        run: |
          bash -n install.sh
          shellcheck install.sh

      # install.ps1 (Windows の入れ方) のリントもここで。PSScriptAnalyzer は Linux の pwsh でも同じに見られる
      # 書き方は PowerShell 5.1 (Windows の既定) に合わせて見る (PSUseCompatibleSyntax)。
      # 読むのは pwsh で — install.ps1 は BOM の無い UTF-8 で、5.1 はそれを ANSI で読む
      # (irm | iex は UTF-8 で受け取るので困らない。-File で 5.1 に渡す入れ方は案内しない)。
      # 外す規則: Write-Host (画面に出す案内)、ShouldProcess (-WhatIf を持つモジュールではない)、BOM (上の理由)。
      - name: Lint install.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $found = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning, Error `
            -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions, PSUseBOMForUnicodeEncodedFile `
            -Settings @{ Rules = @{ PSUseCompatibleSyntax = @{ Enable = $true; TargetVersions = @('5.1', '7.0') } } }
          $found | Format-Table -AutoSize | Out-String -Width 200
          if ($found) { throw "PSScriptAnalyzer: $($found.Count) findings" }

      # Mac で denpa 本体を起こす compose。Mac のランナーには Docker が無いので、書き方だけここで見る
      - name: Mac compose file is valid
        run: docker compose -f compose.mac.yml config -q

      - name: install.sh end to end
        env:
          DENPA_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          bash install.sh --no-open
          curl -fsS http://localhost:3000/api/health; echo
          curl -fsS http://localhost:25252/denpa/tuners; echo
          # ランナーの 80 / 443 は空いているので genkan が入り、http://denpa.localhost で開ける
          # (genkan のコンテナから来る要求が TRUSTED_NETWORKS の既定で通ることも含めて)
          curl -fsS --resolve denpa.localhost:80:127.0.0.1 http://denpa.localhost/api/health; echo
          # 上げ直し。手を入れた compose.override.yml には触らないこと
          echo '# 手で足した行' >> ~/denpa/compose.override.yml
          cp ~/denpa/compose.override.yml "$RUNNER_TEMP/override"
          bash install.sh --no-open
          cmp ~/denpa/compose.override.yml "$RUNNER_TEMP/override"
          # 自分で書いた compose.yml は退けずに上書きする
          test ! -e ~/denpa/compose.yml.bak
          bash install.sh --uninstall
          test -z "$(docker compose -p denpa ps -q)"
          # 外しても compose と設定は残す
          test -f ~/denpa/compose.yml

  # Mac (Apple Silicon) で動かすエージェント (docs/install-mac.md)。
  #
  # **Native AOT は Linux から macOS 向けにビルドできない** ので、Mac のランナーでビルドして起こす。
  # 実機は無いので、確かめるのは「ビルドできる・テストが通る・起動して API が答える・入れ方が最後まで通る」まで。
  #
  # **必須チェックにはしない** (main の ruleset に入れていない)。Mac のランナーは混むと待たされるので、
  # ここで PR を止めない。赤くなったら Mac で壊れたということなので、見て直す
  agent-macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"

      # Linux でしか意味の無いテスト (/proc を数える・Linux の pipe の深さに頼る偽物) は中で飛ばしてある。
      # 1本ずつ結果を出して上限を切る。Mac でだけ止まるものがあったとき、どれなのかが残るように
      - name: Unit tests (.NET agent)
        timeout-minutes: 8
        run: dotnet test --project agent/Denpa.Agent.Tests/Denpa.Agent.Tests.csproj --output detailed --timeout 5m

      - name: Publish (Native AOT, osx-arm64)
        run: dotnet publish agent/Denpa.Agent/Denpa.Agent.csproj -c Release -r osx-arm64 -o out

      - name: Lint install.sh
        run: |
          bash -n install.sh
          brew install shellcheck >/dev/null
          shellcheck install.sh

      # 何も設定せずに起こす (FAKE_TUNE も無し)。チューナーは自動検出で空、カードは
      # リーダーが無いので ok:false が返るはず。**落ちずに答える**ことを見る。
      # PC/SC (PCSC.framework) と libc をここで実際に引く
      - name: Smoke test (published binary)
        run: |
          set -euo pipefail
          ./out/denpa-agent --card || true
          AGENT_PORT=25300 ./out/denpa-agent > agent.log 2>&1 &
          pid=$!
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:25300/denpa/tuners > tuners.json 2>/dev/null && break; sleep 1; done
          echo "tuners: $(cat tuners.json)"
          curl -fsS http://127.0.0.1:25300/denpa/card | tee card.json; echo
          jq -e '.tuners | type == "array"' tuners.json
          jq -e '.ok == false and (.readers | type == "array")' card.json
          # 自分のこと (About.cs)。macOS では CCID ドライバも (`defaults` をここで実際に起こす)
          curl -fsS http://127.0.0.1:25300/denpa/about | tee about.json; echo
          jq -e '.version == "dev" and .os == "macos" and .arch == "arm64" and (.ccidDriver == "apple" or .ccidDriver == "ifd-ccid")' about.json
          # SIGTERM で畳めること (録画していなければすぐ終わる)
          kill -TERM "$pid"
          for _ in $(seq 20); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then echo "SIGTERM で終わりません" >&2; exit 1; fi
          cat agent.log

      # 入れ方を通しで。エージェントはリリースから取らずにいまビルドしたものを入れ、
      # px4-userland / siano-userland / ファームウェアは本物を取ってきてハッシュを確かめ、
      # launchd に載せて API が答えるまで。最後に消す。
      # denpa 本体 (docker compose) は Mac のランナーに Docker が無いので --no-docker で外す
      - name: install.sh end to end
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/denpa-agent.tar.gz" -C out denpa-agent
          DENPA_AGENT_TARBALL="$RUNNER_TEMP/denpa-agent.tar.gz" bash install.sh --no-docker
          curl -fsS http://127.0.0.1:25252/denpa/card; echo
          ls -l "$HOME/Library/Application Support/denpa-agent/px4-userland" "$HOME/Library/Application Support/denpa-agent/siano-userland"
          # libusb は中に抱えている (Homebrew のものに繋がない)。ランナーには Homebrew の libusb が
          # 入りうるので、動いたことでは確かめられない。繋ぎ先を直に見る
          for bin in px4-userland/px4d siano-userland/siano-ts; do
            otool -L "$HOME/Library/Application Support/denpa-agent/$bin"
            if otool -L "$HOME/Library/Application Support/denpa-agent/$bin" | grep -q libusb; then
              echo "$bin が外の libusb に繋いでいます" >&2; exit 1
            fi
          done
          "$HOME/Library/Application Support/denpa-agent/px4-userland/px4d" --list || true
          bash install.sh --uninstall
          test ! -e "$HOME/Library/LaunchAgents/io.github.danything.denpa-agent.plist"
          test ! -e "$HOME/Library/Application Support/denpa-agent"
          # 設定の置き場 (~/denpa/config) は外しても残す
          test -d "$HOME/denpa/config"
          cat "$HOME/Library/Logs/denpa-agent.log"

  # Windows (x64) で動かすエージェント (docs/install-windows.md)。
  #
  # agent-macos と同じく、Native AOT は Linux から Windows 向けにビルドできないので Windows のランナーでビルドして起こす。
  # 実機は無いので、確かめるのは「ビルドできる・テストが通る・起動して API が答える・入れ方が最後まで通る」まで。
  # ランナーには wslc (WSL のコンテナ) が無いので、denpa 本体は -AgentOnly で外す。
  # **必須チェックにはしない** (agent-macos と同じ理由)
  #
  # **2つのジョブに分けて同時に流す。** 1本に並べていた頃は平均3分 (遅い回で4分半) で、
  # 中身はテスト (agent-windows) と、ビルドして起こす・入れ方を通す (agent-windows-install) の
  # 関係ない2つだった。install.ps1 のリントは Windows でなくてよいので install-linux へ移した。
  #
  # **SDK と NuGet は D: に置き、actions/cache で戻す。** SDK のバージョン (10.0.402) はランナーの
  # イメージに入っていないので毎回 300MB を落として展開していて、C: への展開だけで20秒かかっていた
  # (D: なら8秒。ビルドと restore も C: より速い)。キャッシュに当たれば SDK の用意は10秒ほどで済む。
  # 鍵は SDK のバージョンと csproj。バージョンは下の setup-dotnet の行から読む (Renovate が書き換えるのはそこ)
  agent-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Put the SDK and NuGet on D
        id: dirs
        shell: pwsh
        run: |
          "DOTNET_INSTALL_DIR=$env:RUNNER_TEMP\dotnet" >> $env:GITHUB_ENV
          "NUGET_PACKAGES=$env:RUNNER_TEMP\nuget" >> $env:GITHUB_ENV
          $sdk = (Select-String -Path .github/workflows/test.yml -Pattern 'dotnet-version: "([^"]+)"').Matches[0].Groups[1].Value
          "sdk=$sdk" >> $env:GITHUB_OUTPUT

      - name: Restore the SDK and NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}\dotnet
            ${{ runner.temp }}\nuget
          key: agent-windows-test-${{ steps.dirs.outputs.sdk }}-${{ hashFiles('agent/**/*.csproj') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"

      # Linux でしか意味の無いテスト (sysfs・/dev のパス・libc の pipe・/bin/sh の偽物) は中で飛ばしてある。
      # 測るだけのテスト (Px4StreamBenchTests。並べずに1本で流れる) も Windows では飛ばす (Linux と Mac で流れる)
      - name: Unit tests (.NET agent)
        timeout-minutes: 8
        run: dotnet test --project agent/Denpa.Agent.Tests/Denpa.Agent.Tests.csproj --output detailed --timeout 5m

  agent-windows-install:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Put the SDK and NuGet on D
        id: dirs
        shell: pwsh
        run: |
          "DOTNET_INSTALL_DIR=$env:RUNNER_TEMP\dotnet" >> $env:GITHUB_ENV
          "NUGET_PACKAGES=$env:RUNNER_TEMP\nuget" >> $env:GITHUB_ENV
          $sdk = (Select-String -Path .github/workflows/test.yml -Pattern 'dotnet-version: "([^"]+)"').Matches[0].Groups[1].Value
          "sdk=$sdk" >> $env:GITHUB_OUTPUT

      # 鍵はテストのジョブと分ける。中の NuGet が違う (こちらは ILCompiler、あちらは TUnit) ので、
      # 同じ鍵だと先に置いたほうだけが残る
      - name: Restore the SDK and NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}\dotnet
            ${{ runner.temp }}\nuget
          key: agent-windows-publish-${{ steps.dirs.outputs.sdk }}-${{ hashFiles('agent/**/*.csproj') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"

      - name: Publish (Native AOT, win-x64)
        run: dotnet publish agent/Denpa.Agent/Denpa.Agent.csproj -c Release -r win-x64 -o out

      # **このジョブの PowerShell の段には日本語を書かない** (5.1 が ANSI で読んで、引用符が崩れうる)
      # 何も設定せずに起こす。チューナーは自動検出で空、カードはリーダーが無いので ok:false が返るはず。
      # **落ちずに答える**ことを見る。WinSCard (winscard.dll) をここで実際に引く
      - name: Smoke test (published binary)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\out\denpa-agent.exe --card
          $env:AGENT_PORT = '25300'
          $agent = Start-Process .\out\denpa-agent.exe -PassThru -RedirectStandardOutput agent.log -RedirectStandardError agent.err
          $tuners = $null
          for ($i = 0; $i -lt 30 -and -not $tuners; $i++) {
            try { $tuners = Invoke-RestMethod http://127.0.0.1:25300/denpa/tuners } catch { Start-Sleep 1 }
          }
          $card = Invoke-RestMethod http://127.0.0.1:25300/denpa/card
          "tuners: $($tuners | ConvertTo-Json -Compress -Depth 5)"
          "card: $($card | ConvertTo-Json -Compress -Depth 5)"
          if ($null -eq $tuners.tuners) { throw 'no tuners in /denpa/tuners' }
          if ($card.ok -ne $false -or $null -eq $card.readers) { throw 'unexpected /denpa/card' }
          $about = Invoke-RestMethod http://127.0.0.1:25300/denpa/about
          "about: $($about | ConvertTo-Json -Compress)"
          if ($about.version -ne 'dev' -or $about.os -ne 'windows' -or $about.arch -ne 'x64' -or $null -ne $about.ccidDriver) { throw 'unexpected /denpa/about' }
          Stop-Process -Id $agent.Id
          if (-not $agent.WaitForExit(10000)) { throw 'agent did not stop' }
          Get-Content agent.log, agent.err
          # --card exits 1 (no card); do not fail on the last native exit code
          exit 0

      # 入れ方を通しで。エージェントはいまビルドしたものを zip にして入れ、px4-userland・siano-userland と
      # ファームウェアは本物を取ってきてハッシュを確かめ、タスク スケジューラに載せて API が答えるまで。
      # 1回目は irm | iex と同じやり方 (取ってきた中身を scriptblock にして) で流す。2回目は上げ直し
      # (動いているエージェントを止めて入れ替える)。最後に外す
      - name: install.ps1 end to end
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path out\denpa-agent.exe -DestinationPath "$env:RUNNER_TEMP\denpa-agent.zip"
          $env:DENPA_AGENT_ZIP = "$env:RUNNER_TEMP\denpa-agent.zip"
          $script = [scriptblock]::Create((Get-Content install.ps1 -Raw -Encoding UTF8))
          & $script -AgentOnly -NoOpen
          $prefix = "$env:LOCALAPPDATA\denpa-agent"
          Get-ScheduledTask -TaskName denpa-agent | Format-List TaskName, State
          Invoke-RestMethod http://127.0.0.1:25252/denpa/card | ConvertTo-Json -Compress
          & "$prefix\siano-userland\siano-ts.exe" --list
          "siano-ts --list: exit $LASTEXITCODE"
          Get-Content "$prefix\denpa-agent.cmd"

          # px4-userland: only px4d.exe / px4ctl.exe / firmware / license files, no px4-ts.exe or WinSCard.dll.
          # No tuner on the runner, so check that the real binaries run and take our arguments
          $px4 = "$prefix\px4-userland"
          foreach ($file in 'px4d.exe', 'px4ctl.exe', 'firmware\it930x-firmware.bin', 'LICENSE', 'DEPENDENCY-NOTICE.txt') {
            if (-not (Test-Path "$px4\$file")) { throw "px4-userland: $file missing" }
          }
          foreach ($file in 'px4-ts.exe', 'winscard') {
            if (Test-Path "$px4\$file") { throw "px4-userland: $file should not be installed" }
          }
          $ErrorActionPreference = 'Continue'
          $json = & "$px4\px4d.exe" --list-json
          "px4d --list-json: exit $LASTEXITCODE $json"
          if ($LASTEXITCODE -ne 0 -or $json -notmatch '"enclosures"') { throw 'px4d --list-json failed' }
          & "$px4\px4d.exe" --device 00000000000000 --firmware "$px4\firmware\it930x-firmware.bin" --runtime-dir C:\denpa-run --allow-lnb-power --exit-on-stdin-eof
          "px4d without a tuner: exit $LASTEXITCODE"
          if ($LASTEXITCODE -ne 3) { throw 'px4d should say NOT_FOUND (exit 3)' }
          & "$px4\px4ctl.exe" --device 00000000000000 --runtime-dir C:\denpa-run status
          "px4ctl status without px4d: exit $LASTEXITCODE"
          if ($LASTEXITCODE -eq 0) { throw 'px4ctl status should fail without px4d' }
          $ErrorActionPreference = 'Stop'
          # C:\denpa-run: owned by the user, protected DACL with the user, SYSTEM and Administrators only
          $acl = Get-Acl C:\denpa-run
          $acl.Access | Format-Table IdentityReference, FileSystemRights, IsInherited -AutoSize
          if ($acl.Owner -ne [Security.Principal.WindowsIdentity]::GetCurrent().Name) { throw "C:\denpa-run owner is $($acl.Owner)" }
          if (-not $acl.AreAccessRulesProtected -or @($acl.Access).Count -ne 3) { throw 'C:\denpa-run DACL is not the expected one' }

          & $script -AgentOnly -NoOpen
          $tuners = Invoke-RestMethod http://127.0.0.1:25252/denpa/tuners
          if ($null -eq $tuners.tuners) { throw 'agent does not answer after the upgrade' }

          & $script -Uninstall
          if (Get-ScheduledTask -TaskName denpa-agent -ErrorAction SilentlyContinue) { throw 'task left' }
          if (Test-Path $prefix) { throw "$prefix left" }
          if (Test-Path C:\denpa-run) { throw 'C:\denpa-run left' }
          if (Get-Process denpa-agent -ErrorAction SilentlyContinue) { throw 'agent still running' }
          # keeps ~/denpa/config
          if (-not (Test-Path "$env:USERPROFILE\denpa\config")) { throw '~/denpa/config removed' }
          Get-Content "$env:USERPROFILE\denpa\denpa-agent.log"
          exit 0

  # 予約から録画・エンコード・保存先への配置まで、偽の放送で通しで流す
  e2e:
    runs-on: ubuntu-latest
    # 中身は3分もかからない。ここに引っかかるのは待ちぼうけしているとき
    timeout-minutes: 12
    strategy:
      # 1つ落ちても残りは最後まで流す。落ち方を全部まとめて見たい
      fail-fast: false
      matrix:
        # 組の中身は tests/e2e/shards.json (実測の所要時間で人が割る)。
        # playwright の --shard はテスト数で機械的に割るので、重いスペックが
        # 同じ組に固まり、28秒の組と3.6分の組ができていた
        # **組を増やしたら、main の ruleset の必須チェックにも `e2e (n)` を足すこと** (足さないと
        # 増やした組が落ちていてもマージできてしまう。bump の PR は ruleset から引くので直さなくてよい)
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read bun version from Dockerfile
        id: bun
        run: echo "version=$(grep -oP 'oven/bun:\K[^-\s]+' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ブラウザは 270MB ほどあり、毎回落とすと1分近く持っていかれる。
      # 中身は Playwright のバージョンでしか変わらないので、それを鍵にする。
      # **割った先どうしで使い回せている** (実測で 269MB を7秒で復元)
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(bun pm ls | grep -oP '@playwright/test@\K[^\s]+' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # **`--with-deps` は使わない。** apt を使うところで、キャッシュに乗らないので
      # 毎回走る。そして**ここだけが詰まる** — 9分24秒 掛かった回があり、上限を
      # 4分に切ったら今度はそこで打ち切られた (ブラウザ自体はキャッシュから
      # 7秒で戻っていて、落としてすらいない)。
      #
      # 何を入れているのか数えたら、**ライブラリは1つも要らなかった**。
      # ubuntu-latest には chromium の依存 (libnss3, libgbm1, libasound2t64…) が
      # 全部入っていて、新しく入るのは**フォント9つだけ**
      # (fonts-ipafont-gothic, xfonts-* など)。E2E は DOM の文字を見るだけで
      # 画像は比べていないので、字が豆腐でも結果は変わらない。
      #
      # ランナーの中身が変わってライブラリが欠けたら、ブラウザが起動できずに
      # 落ちる。そのときは足りないものだけを apt で入れる (総当たりに戻さない)
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 4
        run: bunx playwright install chromium

      # **組分けの検算と、この組で流すスペック。** shards.json に書いた名前のファイルが無い
      # (消した・名前を変えた)、2つの組に入っている、は落とす。**どの組にも入っていない
      # スペックは 5 組で流す** — 落とすと、同じ日に e2e を足す PR どうしが shards.json の
      # 同じ行を取り合ってぶつかる。足した PR では 5 組に寄るだけなので、所要時間を見て
      # あとで割り直せばよい (どれが寄ったかは注記に出す)
      - name: 組分けの検算
        id: specs
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          ls tests/e2e/*.spec.ts | xargs -n1 basename | sed 's/\.spec\.ts$//' | sort > "$RUNNER_TEMP/all"
          jq -r 'del(."//") | .[][]' tests/e2e/shards.json | sort > "$RUNNER_TEMP/listed"
          jq -e 'del(."//") | keys == ["1","2","3","4","5"]' tests/e2e/shards.json > /dev/null
          dup=$(uniq -d "$RUNNER_TEMP/listed")
          if [ -n "$dup" ]; then echo "::error::2つの組に入っています: $(echo $dup)"; exit 1; fi
          gone=$(comm -13 "$RUNNER_TEMP/all" "$RUNNER_TEMP/listed")
          if [ -n "$gone" ]; then echo "::error::shards.json にあるのにファイルがありません: $(echo $gone)"; exit 1; fi
          specs=$(jq -r --arg s "$SHARD" '.[$s][]' tests/e2e/shards.json)
          rest=$(comm -23 "$RUNNER_TEMP/all" "$RUNNER_TEMP/listed")
          if [ "$SHARD" = 5 ] && [ -n "$rest" ]; then
            echo "::notice::どの組にも入っていないスペックを 5 組で流します: $(echo $rest)"
            specs="$specs $rest"
          fi
          test -n "$specs"
          echo "files=$(for s in $specs; do printf 'tests/e2e/%s.spec.ts ' "$s"; done)" >> "$GITHUB_OUTPUT"

      # **ライブを変換せずに見る経路・互換モードのデコーダ** (docs/stream.md#放送そのままmpeg-2を送る)。ブラウザで MPEG-2 と
      # AAC・Opus をデコードする WASM は Dockerfile の `mpeg2wasm` 段で組む (emscripten)。E2E は
      # イメージを使わずランナーで回すので、その段だけ組んで取り出し、`MPEG2_DIR` で denpa に渡す。
      #
      # **組んだものは actions/cache に置いて使い回す。** 中身が変わるのは段の書き方
      # (emsdk・FFmpeg のバージョン) か wasm/decoder.c を変えたときだけなので、その2つを鍵にする。
      # 当たれば 1〜2 秒で戻る (前は buildx を立てて層のキャッシュから組み直すのに 15 秒ほど)。
      # **どの組でも戻す** — 要るスペック (28-live-raw・38-live-compat…) がどの組にあっても、
      # 組分けを気にせず足せるように。外れたときだけ、その組で組んで置く (外れるのは
      # 上の2つを変えた PR と、それが main に入った直後の1回だけ。組が同時に組んでも
      # 置けるのは1つで、残りは「もうある」と言って置かずに進む)
      - name: Key for the MPEG-2 decoder (WASM)
        id: mpeg2
        run: |
          stage=$(sed -n '/ AS mpeg2wasm$/,/^COPY --from=mpeg2wasm /p' Dockerfile)
          test -n "$stage"
          echo "stage=$(printf '%s' "$stage" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the MPEG-2 decoder (WASM)
        id: mpeg2-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/mpeg2
          key: mpeg2wasm-${{ steps.mpeg2.outputs.stage }}-${{ hashFiles('wasm/**') }}

      - name: Build the MPEG-2 decoder (WASM)
        if: steps.mpeg2-cache.outputs.cache-hit != 'true'
        run: docker build --target mpeg2wasm-out --output "type=local,dest=$RUNNER_TEMP/mpeg2" .

      - name: Save the MPEG-2 decoder (WASM)
        if: steps.mpeg2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/mpeg2
          key: ${{ steps.mpeg2-cache.outputs.cache-primary-key }}

      # アプリを1度だけ組んでから、ワーカーの数だけ立てる。
      # 偽エージェント・偽通知先もワーカーごとに1式ずつ (tests/stack.ts)
      - name: E2E tests
        env:
          MPEG2_DIR: ${{ runner.temp }}/mpeg2
        run: bunx playwright test ${{ steps.specs.outputs.files }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # 割った先ごとに名前を変える。同じ名前だと後から上げたほうで断られる
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7
