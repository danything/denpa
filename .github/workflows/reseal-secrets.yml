name: Reseal secrets

# 平文の値は GitHub Secrets 側にだけ置く。sealed-secrets コントローラーの公開鍵
# (非秘密) は org の Actions variable `SEALED_SECRETS_PUB_CERT` に置いていて、
# それで kubeseal し、結果の SealedSecret だけをコミットする。値を変えたら
# Secrets を更新してこのワークフローを再実行する。鍵のローテーションは
# bootstrap/fetch-cert.sh 参照（org変数の更新もそちらで行う）。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Seal denpa-oidc
        env:
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          OIDC_GROUP: ${{ secrets.OIDC_GROUP }}
          PUB_CERT: ${{ vars.SEALED_SECRETS_PUB_CERT }}
        run: |
          set -eu
          if ! command -v kubeseal >/dev/null 2>&1; then
            curl -sfL "https://github.com/bitnami/sealed-secrets/releases/download/v0.38.4/kubeseal-0.38.4-linux-amd64.tar.gz" \
              | tar -xz -C /tmp kubeseal
            sudo install -m 0755 /tmp/kubeseal /usr/local/bin/kubeseal
          fi

          printf '%s' "$PUB_CERT" > /tmp/pub-cert.pem

          kubectl create secret generic denpa-oidc \
            --namespace denpa \
            --from-literal=issuer="$OIDC_ISSUER" \
            --from-literal=client-id="$OIDC_CLIENT_ID" \
            --from-literal=client-secret="$OIDC_CLIENT_SECRET" \
            --from-literal=group="$OIDC_GROUP" \
            --dry-run=client -o yaml \
          | kubeseal --cert /tmp/pub-cert.pem --format yaml \
          > k3s/oidc-sealed.yaml

      - name: Commit and push
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k3s/oidc-sealed.yaml
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: reseal denpa-oidc"
          git push
