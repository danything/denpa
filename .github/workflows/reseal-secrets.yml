name: Reseal secrets

# 平文の値は GitHub Secrets 側にだけ置く。danything/bootstrap/.github/actions/kubeseal
# が、そこに同梱の公開鍵証明書(pub-cert.pem)で kubeseal し、結果の SealedSecret だけを
# コミットする。値を変えたら Secrets を更新してこのワークフローを再実行する
# (経緯は danything/bootstrap の README 参照)。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Seal denpa-oidc
        uses: danything/bootstrap/.github/actions/kubeseal@main
        with:
          namespace: denpa
          name: denpa-oidc
          output-file: k3s/oidc-sealed.yaml
          data: |
            {
              "issuer": ${{ toJSON(secrets.OIDC_ISSUER) }},
              "client-id": ${{ toJSON(secrets.OIDC_CLIENT_ID) }},
              "client-secret": ${{ toJSON(secrets.OIDC_CLIENT_SECRET) }},
              "group": ${{ toJSON(secrets.OIDC_GROUP) }}
            }

      - name: Commit and push
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k3s/oidc-sealed.yaml
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: reseal denpa-oidc"
          git push
