name: Publish @danything/arib

# **`packages/arib` を npm に出す** (docs/development.md「`@danything/arib` を出す」)。main のコミットに
# タグ `arib-v<版>` を押すと出る。版は packages/arib/package.json の `version` と同じにする (違えば止まる)。
#
# npm へはふだん Trusted Publishing (OIDC) で出す。トークンは持たず、provenance も付く。
# npm 側で、このリポジトリのこの workflow (arib-publish.yml) を信頼する設定が要る。
# Trusted Publishing はパッケージが npm にあってからしか設定できないので、**最初の1回だけ**は
# リポジトリの secret `NPM_TOKEN` (npm の granular access token) で出す。出したら secret は消す
on:
  push:
    tags: ["arib-v*"]

concurrency:
  group: arib-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag is on main and matches package version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "タグ ${GITHUB_REF_NAME} が main のコミットに付いていない"
            exit 1
          }
          version=$(jq -r .version packages/arib/package.json)
          test "${GITHUB_REF_NAME}" = "arib-v${version}" || {
            echo "タグ ${GITHUB_REF_NAME} と packages/arib/package.json の版 ${version} が違う"
            exit 1
          }

      # bun の版は Dockerfile と食い違わないよう、そこから読む (test.yml と同じ)
      - name: Read bun version from Dockerfile
        id: bun
        run: echo "version=$(grep -oP 'oven/bun:\K[^-\s]+' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test packages/arib

      - name: Build
        working-directory: packages/arib
        run: |
          bun run build
          bun scripts/manifest.ts

      # Trusted Publishing は npm 11.5.1 から
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          check-latest: true
          registry-url: https://registry.npmjs.org

      # npm は OIDC を先に試し、信頼する設定が無ければトークンに戻る (最初の1回)
      - name: Publish
        working-directory: packages/arib
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
