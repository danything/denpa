name: Publish @doany/arib

# **`packages/arib` を npm に出す** (README の「版」)。タグ `arib-v<版>` を押すと出る。
# 版は packages/arib/package.json の `version` と同じにする (違えば止まる)。
#
# npm へは Trusted Publishing (OIDC) で出すので、トークンは持たない。provenance も付く。
# npm 側で、このリポジトリのこの workflow (arib-publish.yml) を信頼する設定が要る。
# Trusted Publishing はパッケージが npm にあってからしか設定できないので、**最初の1回だけ**は
# 手で回して (workflow_dispatch) できた tgz を artifact から取り、手元で `npm publish <tgz> --access public` する
on:
  push:
    tags: ["arib-v*"]
  workflow_dispatch: {}

concurrency:
  group: arib-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # bun の版は Dockerfile と食い違わないよう、そこから読む (test.yml と同じ)
      - name: Read bun version from Dockerfile
        id: bun
        run: echo "version=$(grep -oP 'oven/bun:\K[^-\s]+' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .version packages/arib/package.json)
          test "${GITHUB_REF_NAME}" = "arib-v${version}" || {
            echo "タグ ${GITHUB_REF_NAME} と packages/arib/package.json の版 ${version} が違う"
            exit 1
          }

      - name: Test
        run: bun test packages/arib

      - name: Build
        working-directory: packages/arib
        run: |
          bun run build
          bun scripts/manifest.ts

      # Trusted Publishing は npm 11.5.1 から
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          check-latest: true
          registry-url: https://registry.npmjs.org

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/arib
        run: npm publish --access public

      - name: Pack (first publish by hand)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: packages/arib
        run: npm pack

      - name: Upload package
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: arib-package
          path: packages/arib/*.tgz
