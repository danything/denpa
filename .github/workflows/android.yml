name: Android

# **Android で denpa を動かすアプリ** (android/) と、中に入れるエージェント (`linux-bionic-arm64`・`linux-bionic-x64` の Native AOT) を組む。
# CI (test.yml) は debug の APK をエミュレータで入れて起動して確かめ、リリース (release.yml) はリリースの鍵で署名した arm64 の APK
# (`denpa-<バージョン>-android-arm64.apk`) を組む。組み方は docs/development.md「Android 向けのエージェント」「Android のアプリ」。
#
# 1. OpenSSL を NDK で静的ライブラリに組む (.github/openssl-android.sh)。**組んだものは actions/cache に置き、バージョン・組み方・NDK が
#    変わるまで使い回す**
# 2. エージェントを NDK の clang で組む。ASP.NET Core は linux の実行時パックの IL を使わせる (csproj の説明)
# 3. アプリを Gradle で組む。2 を `libdenpa_agent.so` の名前で APK に入れる。asicen-userland の上流の Android 版も
#    `libasicend.so`・`libasicenctl.so` の名前で入れる (.github/asicen-android.sh。SHA-256 を固定して取る)。CI は両方の ABI を入れ、
#    lint と単体テストも流し、R8 で縮める release も debug の鍵で組む。リリースは arm64 だけを入れ、リリースの鍵で署名する。
#    bun の公式の Android 版も `libbun.so` の名前で入れる (.github/bun-android.sh。SHA-256 を固定して取る)。x86_64 は CI のエミュレータ用。
#    ffmpeg・ffprobe は NDK で組み (.github/ffmpeg-android.sh。2 と並べて流す)、`libffmpeg.so`・`libffprobe.so` と libav* の共有ライブラリを入れる。
#    denpa 本体 (Dockerfile の native-files 段) を `assets/server.zip` に入れる。常駐サービスが書き出して bun で起動する
# 4. debug の APK をエミュレータ (minSdk の API 29 と、新しい API 35。x86_64) に入れ、常駐サービス・通知・エージェント・asicend の起動・
#    bun の起動・ffmpeg と ffprobe (tests/native-smoke.ts を bun で流す)・denpa 本体の起動とエージェントと組むこと・更新・「終了」・端末の起動を確かめる (.github/android-app-smoke.sh)。
#    arm64 は組むところまで (GitHub のランナーで arm64 のエミュレータは遅すぎる)。リリースでは流さない (同じコミットを main で確かめてある)
#
# 組むのは呼んだ workflow のコミット (リリースならタグ)。コミットを入力で受けて取り出すことはしない (windows-server.yml と同じく、キャッシュを汚させない)

on:
  workflow_call:
    inputs:
      tag:
        description: "リリースのタグ (v1.2.3 の形)。CI は dev (debug の APK と、debug の鍵で署名した release を組むだけ)"
        type: string
        default: dev
    # リリースの署名の鍵 (docs/development.md「Android のアプリ」)。release.yml だけが渡す
    secrets:
      DENPA_ANDROID_KEYSTORE_BASE64:
        required: false
      DENPA_ANDROID_KEYSTORE_PASSWORD:
        required: false
      DENPA_ANDROID_KEY_ALIAS:
        required: false
      DENPA_ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  # NDK のバージョン (sdkmanager の名前)。上げたら OpenSSL と ffmpeg のキャッシュも組み直しになる (鍵に入れている)
  NDK_VERSION: "29.0.14206865"

jobs:
  agent:
    name: agent (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            rid: linux-bionic-arm64
          - abi: x86_64
            rid: linux-bionic-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "11.0.100"

      # ランナーに入っている NDK はランナーのイメージで変わるので、バージョンを決めて入れる
      - name: Set up NDK
        run: |
          set -euo pipefail
          # yes は sdkmanager が閉じると SIGPIPE で終わるので、終わり方を見ない
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache key
        id: key
        run: echo "openssl=openssl-android-${{ matrix.abi }}-ndk$NDK_VERSION-$(sha256sum .github/openssl-android.sh | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore OpenSSL
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: openssl-out
          key: ${{ steps.key.outputs.openssl }}

      - name: Build OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash .github/openssl-android.sh "${{ matrix.abi }}" openssl-out

      - name: Save OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: openssl-out
          key: ${{ steps.key.outputs.openssl }}

      # NDK の clang を PATH の先頭に置く (csproj が `<triple>24-clang` を呼ぶ。暗号の部品もこれで組まれる)
      - name: Publish (Native AOT, ${{ matrix.rid }})
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export OPENSSL_ROOT_DIR="$PWD/openssl-out"
          # バージョンは実行ファイルに入れる (`GET /denpa/about`。リリースはタグ、CI は csproj の既定の dev)
          version=()
          if [ "$TAG" != dev ]; then version=("-p:InformationalVersion=$TAG"); fi
          dotnet publish agent/Denpa.Agent/Denpa.Agent.csproj -c Release -r "${{ matrix.rid }}" "${version[@]}" -o out
          readelf=llvm-readelf
          # 動的リンカは Android のもの、繋ぐのは Android にある libc・libm・libdl だけ。LOAD は 16 KB 以上に揃える
          $readelf -l out/denpa-agent | grep -F '[Requesting program interpreter: /system/bin/linker64]'
          needed=$($readelf -d out/denpa-agent | sed -nE 's/.*\(NEEDED\).*\[(.+)\]/\1/p' | sort | tr '\n' ' ')
          echo "NEEDED: $needed"
          test "$needed" = "libc.so libdl.so libm.so "
          for align in $($readelf -lW out/denpa-agent | awk '$1 == "LOAD" { print $NF }'); do test "$((align))" -ge 16384; done
          ls -l out/denpa-agent
          # OpenSSL のライセンスの文書を一緒に渡し、APK に入れる (android/app/build.gradle.kts の DENPA_AGENT_LICENSES)
          cp openssl-out/LICENSE.txt out/LICENSE.openssl

      - name: Upload agent
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: denpa-agent-android-${{ matrix.abi }}
          path: |
            out/denpa-agent
            out/LICENSE.openssl
          retention-days: 3

  # ffmpeg・ffprobe と libav* を NDK で組む (.github/ffmpeg-android.sh)。**組んだものは actions/cache に置き、Dockerfile の ffmpeg 段と
  # 組むスクリプトと NDK が変わるまで使い回す**。依存 (Opus・SVT-AV1・x264・dav1d・zimg) の組み上がりはそれぞれ別のキャッシュに置き、
  # バージョンと組み方が変わるまで使い回す (macos-server.yml の ffmpeg と同じ作り)。リリースでも x86_64 を組むが、APK には入れない
  ffmpeg:
    name: ffmpeg (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 鍵は Dockerfile の ffmpeg 段 (土台の FROM の行は除く)、組むスクリプト、patches/、NDK。
      # 依存の鍵はバージョンと、スクリプトの `# recipe:<名前>:begin` から `:end` までの組み方 (x264・dav1d・zimg はバージョンも中にある) と NDK
      - name: Cache key
        id: key
        run: |
          set -euo pipefail
          stage=$(awk '/^FROM .* AS ffmpeg$/ { f = 1; next } /^FROM / { f = 0 } f' Dockerfile)
          base="ffmpeg-android-${{ matrix.abi }}-ndk$NDK_VERSION"
          hash=$( { printf '%s\n' "$stage"; cat .github/ffmpeg-android.sh patches/*; } | sha256sum | cut -c1-16)
          echo "key=$base-$hash" >> "$GITHUB_OUTPUT"
          version() { sed -nE "s/^(ARG|ENV) $1=(.+)$/\2/p" <<< "$stage" | head -1; }
          recipe() { sed -n "/^# recipe:$1:begin/,/^# recipe:$1:end/p" .github/ffmpeg-android.sh | sha256sum | cut -c1-16; }
          # 読めなかったら止める (空のままだと、バージョンや組み方を変えても鍵が変わらない)
          for v in OPUS_VERSION SVT_AV1_VERSION; do
            test -n "$(version $v)" || { echo "Dockerfile の ffmpeg 段に $v がありません" >&2; exit 1; }
          done
          for r in opus svt-av1 x264 dav1d zimg; do
            grep -q "^# recipe:$r:end" .github/ffmpeg-android.sh || { echo "ffmpeg-android.sh に recipe:$r がありません" >&2; exit 1; }
          done
          echo "opus=$base-opus-$(version OPUS_VERSION)-$(recipe opus)" >> "$GITHUB_OUTPUT"
          echo "svtav1=$base-svt-av1-$(version SVT_AV1_VERSION)-$(recipe svt-av1)" >> "$GITHUB_OUTPUT"
          echo "x264=$base-x264-$(recipe x264)" >> "$GITHUB_OUTPUT"
          echo "dav1d=$base-dav1d-$(recipe dav1d)" >> "$GITHUB_OUTPUT"
          echo "zimg=$base-zimg-$(recipe zimg)" >> "$GITHUB_OUTPUT"

      - name: Restore ffmpeg
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffmpeg-out
          key: ${{ steps.key.outputs.key }}

      # x264・dav1d・SVT-AV1・ffmpeg の x86_64 のアセンブリは nasm で、dav1d は meson で、zimg は autotools で組む。cmake はランナーに入っている。
      # NDK はランナーのイメージで変わるので、バージョンを決めて入れる (agent と同じ)
      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nasm meson ninja-build autoconf automake libtool > /dev/null
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # 組み上がり (入れ先は .github/ffmpeg-android.sh の `deps`)。ffmpeg が当たらなかったときだけ使う
      - name: Restore Opus
        id: opus
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-android-${{ matrix.abi }}-deps/opus
          key: ${{ steps.key.outputs.opus }}

      - name: Restore SVT-AV1
        id: svtav1
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-android-${{ matrix.abi }}-deps/svt-av1
          key: ${{ steps.key.outputs.svtav1 }}

      - name: Restore x264
        id: x264
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-android-${{ matrix.abi }}-deps/x264
          key: ${{ steps.key.outputs.x264 }}

      - name: Restore dav1d
        id: dav1d
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-android-${{ matrix.abi }}-deps/dav1d
          key: ${{ steps.key.outputs.dav1d }}

      - name: Restore zimg
        id: zimg
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-android-${{ matrix.abi }}-deps/zimg
          key: ${{ steps.key.outputs.zimg }}

      # 依存は組み終えた直後に保存する (ffmpeg のビルドが落ちても残る)。ffmpeg 本体は成功したときだけ保存する
      - name: Build Opus
        if: steps.cache.outputs.cache-hit != 'true' && steps.opus.outputs.cache-hit != 'true'
        run: bash .github/ffmpeg-android.sh ffmpeg-out "${{ matrix.abi }}" opus

      - name: Save Opus
        if: steps.cache.outputs.cache-hit != 'true' && steps.opus.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-android-${{ matrix.abi }}-deps/opus
          key: ${{ steps.key.outputs.opus }}

      - name: Build SVT-AV1
        if: steps.cache.outputs.cache-hit != 'true' && steps.svtav1.outputs.cache-hit != 'true'
        run: bash .github/ffmpeg-android.sh ffmpeg-out "${{ matrix.abi }}" svt-av1

      - name: Save SVT-AV1
        if: steps.cache.outputs.cache-hit != 'true' && steps.svtav1.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-android-${{ matrix.abi }}-deps/svt-av1
          key: ${{ steps.key.outputs.svtav1 }}

      - name: Build x264
        if: steps.cache.outputs.cache-hit != 'true' && steps.x264.outputs.cache-hit != 'true'
        run: bash .github/ffmpeg-android.sh ffmpeg-out "${{ matrix.abi }}" x264

      - name: Save x264
        if: steps.cache.outputs.cache-hit != 'true' && steps.x264.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-android-${{ matrix.abi }}-deps/x264
          key: ${{ steps.key.outputs.x264 }}

      - name: Build dav1d
        if: steps.cache.outputs.cache-hit != 'true' && steps.dav1d.outputs.cache-hit != 'true'
        run: bash .github/ffmpeg-android.sh ffmpeg-out "${{ matrix.abi }}" dav1d

      - name: Save dav1d
        if: steps.cache.outputs.cache-hit != 'true' && steps.dav1d.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-android-${{ matrix.abi }}-deps/dav1d
          key: ${{ steps.key.outputs.dav1d }}

      - name: Build zimg
        if: steps.cache.outputs.cache-hit != 'true' && steps.zimg.outputs.cache-hit != 'true'
        run: bash .github/ffmpeg-android.sh ffmpeg-out "${{ matrix.abi }}" zimg

      - name: Save zimg
        if: steps.cache.outputs.cache-hit != 'true' && steps.zimg.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-android-${{ matrix.abi }}-deps/zimg
          key: ${{ steps.key.outputs.zimg }}

      - name: Build ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash .github/ffmpeg-android.sh ffmpeg-out "${{ matrix.abi }}"

      - name: Save ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffmpeg-out
          key: ${{ steps.key.outputs.key }}

      # 入れ先の形 (jniLibs/<ABI>/ と assets/licenses/ffmpeg/) のまま渡す。app が 2 つの ABI を 1 つの置き場に重ねる
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-android-${{ matrix.abi }}
          path: ffmpeg-out/
          retention-days: 3

  # denpa 本体 (Dockerfile の `native-files` 段。アプリ・字・デコーダ)。macos-server.yml・windows-server.yml と同じく、main のビルドが置いたキャッシュ (amd64) から組む。
  # OS に依らないので、どの ABI の APK にも同じものを入れる
  files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        run: |
          docker buildx build --target native-files --platform linux/amd64 \
            --cache-from "type=registry,ref=ghcr.io/${{ github.repository_owner }}/denpa:buildcache-amd64" \
            --output type=local,dest=files .
          find files -maxdepth 2 | sort

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-server-files
          path: files
          retention-days: 3

  # アプリ (android/)。CI は debug の鍵で署名する。リリースはリリースの鍵で署名し、arm64 の APK だけを渡す (release.yml が添える)
  app:
    needs: [agent, ffmpeg, files]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK はその時点の最新の安定版 (Gradle 9.8 から 27 で動く)。Android SDK はランナーに入っている。足りない platform は AGP が取ってくる
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          # renovate: datasource=java-version depName=java-jdk
          java-version: "27"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Download agent (arm64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: denpa-agent-android-arm64
          path: agent-out/arm64

      - name: Download agent (x86_64)
        if: inputs.tag == 'dev'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: denpa-agent-android-x86_64
          path: agent-out/x86_64

      # ffmpeg は android/ffmpeg/ に重ねる (android/app/build.gradle.kts の DENPA_FFMPEG)。ライセンスの文書は 2 つの ABI で同じもの
      - name: Download ffmpeg (arm64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-android-arm64
          path: android/ffmpeg

      - name: Download ffmpeg (x86_64)
        if: inputs.tag == 'dev'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-android-x86_64
          path: android/ffmpeg

      # denpa 本体は 1 つの zip にして android/server/assets/server.zip に置く (android/app/build.gradle.kts の DENPA_SERVER)。
      # zip にするのは、AGP が assets の `_` で始まるディレクトリ (SvelteKit の `_app/`) を APK に入れないため
      - name: Download denpa
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-server-files
          path: server-files

      - name: Pack denpa
        run: |
          set -euo pipefail
          for f in app/server.js app/build/index.js font/denpa-font.woff2 mpeg2/decoder.wasm; do
            test -f "server-files/$f" || { echo "$f がありません" >&2; exit 1; }
          done
          mkdir -p android/server/assets
          (cd server-files && zip -qrX ../android/server/assets/server.zip app font mpeg2)
          echo "$(find server-files -type f | wc -l) ファイル"
          ls -l android/server/assets/server.zip

      # エージェントは jniLibs の `<ABI>/libdenpa_agent.so` に、OpenSSL のライセンスの文書は agent-licenses/ に置く
      # (android/app/build.gradle.kts の DENPA_AGENT_LIBS・DENPA_AGENT_LICENSES)
      - name: Build APK (lint, unit tests, debug, release)
        if: inputs.tag == 'dev'
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p agent-libs/arm64-v8a agent-libs/x86_64 agent-licenses
          cp ../agent-out/arm64/denpa-agent agent-libs/arm64-v8a/libdenpa_agent.so
          cp ../agent-out/x86_64/denpa-agent agent-libs/x86_64/libdenpa_agent.so
          cp ../agent-out/arm64/LICENSE.openssl agent-licenses/
          # asicen-userland は android/asicen-userland/ に (android/app/build.gradle.kts の DENPA_ASICEN)
          bash ../.github/asicen-android.sh asicen-userland arm64 x86_64
          # bun は android/bun/ に (android/app/build.gradle.kts の DENPA_BUN)
          bash ../.github/bun-android.sh bun arm64 x86_64
          # release は R8 で縮めたものが組めるかを見る (鍵を渡さないので debug の鍵で署名される)
          ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease --console=plain
          # 両方の ABI のエージェントと asicen-userland と bun と ffmpeg、ファームウェア、ライセンスの文書が入っていること
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            unzip -l "$apk" > apk.txt
            for abi in arm64-v8a x86_64; do
              for lib in libdenpa_agent libasicend libasicenctl libbun libffmpeg libffprobe libavcodec libavdevice libavfilter libavformat libavutil libswresample libswscale; do grep -E " lib/$abi/$lib\.so$" apk.txt; done
            done
            grep -E ' assets/asicen/asicen-loader\.bin$' apk.txt
            grep -E ' assets/licenses/LICENCE\.siano$' apk.txt
            grep -E ' assets/licenses/LICENSE\.openssl$' apk.txt
            grep -E ' assets/licenses/LICENSE$' apk.txt
            grep -E ' assets/licenses/bun/LICENSE\.md$' apk.txt
            grep -E ' assets/licenses/ffmpeg/(SOURCE\.txt|versions\.txt|ffmpeg/COPYING\.GPLv3|x264/COPYING)$' apk.txt | wc -l | grep -qx 4
            grep -E ' assets/licenses/asicen-userland/(LICENSE|SOURCE\.txt|COPYING\.libusb|VENDOR-FIRMWARE-NOTICE\.txt)$' apk.txt | wc -l | grep -qx 4
            # denpa 本体 (debug にも release にも入る)
            grep -E ' assets/server\.zip$' apk.txt
          done
          ls -l app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          # 証明書の突き合わせは、リリースと同じ手順 (.github/android-apk-cert.sh) で流す。比べるのは、AGP がこのランナーで作った debug の鍵の証明書
          debug_cert=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | sha256sum | cut -c1-64)
          bash ../.github/android-apk-cert.sh app/build/outputs/apk/release/app-release.apk "$debug_cert"

      - name: Upload APK
        if: inputs.tag == 'dev'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: denpa-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # リリースの APK。**鍵が無ければ止める** (debug の鍵の APK をリリースに載せると、あとでリリースの鍵の APK に上書きできない)。
      # 署名した証明書の SHA-256 を、下に書いた鍵のものと突き合わせる (secrets の鍵が入れ替わっていたら止める)
      - name: Build APK (release, arm64)
        if: inputs.tag != 'dev'
        working-directory: android
        env:
          TAG: ${{ inputs.tag }}
          KEYSTORE_BASE64: ${{ secrets.DENPA_ANDROID_KEYSTORE_BASE64 }}
          DENPA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DENPA_ANDROID_KEYSTORE_PASSWORD }}
          DENPA_ANDROID_KEY_ALIAS: ${{ secrets.DENPA_ANDROID_KEY_ALIAS }}
          DENPA_ANDROID_KEY_PASSWORD: ${{ secrets.DENPA_ANDROID_KEY_PASSWORD }}
          # リリースの鍵の証明書の SHA-256 (docs/install-android.md にも書いてある)
          CERT_SHA256: 9cfa63965769c4c24f84a9516cb57bb463e94febaf4f3fd34cbd4758321a8277
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$DENPA_ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$DENPA_ANDROID_KEY_ALIAS" ] || [ -z "$DENPA_ANDROID_KEY_PASSWORD" ]; then
            echo "::error::リリースの署名の鍵 (DENPA_ANDROID_KEYSTORE_*・DENPA_ANDROID_KEY_*) が secrets にありません"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export DENPA_ANDROID_KEYSTORE="$RUNNER_TEMP/release.p12"
          export DENPA_VERSION="$TAG"
          mkdir -p agent-libs/arm64-v8a agent-licenses
          cp ../agent-out/arm64/denpa-agent agent-libs/arm64-v8a/libdenpa_agent.so
          cp ../agent-out/arm64/LICENSE.openssl agent-licenses/
          bash ../.github/asicen-android.sh asicen-userland arm64
          bash ../.github/bun-android.sh bun arm64
          ./gradlew assembleRelease --console=plain
          rm -f "$RUNNER_TEMP/release.p12"
          apk=app/build/outputs/apk/release/app-release.apk
          # 入っているネイティブのライブラリは arm64 のエージェントと asicen-userland と bun と ffmpeg だけ。ファームウェアとライセンスの文書も入っていること
          unzip -l "$apk" > apk.txt
          test "$(grep -oE ' lib/[^ ]+$' apk.txt | sort | tr '\n' ' ')" = " lib/arm64-v8a/libasicenctl.so  lib/arm64-v8a/libasicend.so  lib/arm64-v8a/libavcodec.so  lib/arm64-v8a/libavdevice.so  lib/arm64-v8a/libavfilter.so  lib/arm64-v8a/libavformat.so  lib/arm64-v8a/libavutil.so  lib/arm64-v8a/libbun.so  lib/arm64-v8a/libdenpa_agent.so  lib/arm64-v8a/libffmpeg.so  lib/arm64-v8a/libffprobe.so  lib/arm64-v8a/libswresample.so  lib/arm64-v8a/libswscale.so "
          grep -E ' assets/asicen/asicen-loader\.bin$' apk.txt
          grep -E ' assets/licenses/LICENCE\.siano$' apk.txt
          grep -E ' assets/licenses/LICENSE\.openssl$' apk.txt
          grep -E ' assets/licenses/LICENSE$' apk.txt
          grep -E ' assets/licenses/asicen-userland/SOURCE\.txt$' apk.txt
          grep -E ' assets/licenses/bun/LICENSE\.md$' apk.txt
          grep -E ' assets/licenses/ffmpeg/(SOURCE\.txt|versions\.txt|ffmpeg/COPYING\.GPLv3|x264/COPYING)$' apk.txt | wc -l | grep -qx 4
          # denpa 本体
          grep -E ' assets/server\.zip$' apk.txt
          bash ../.github/android-apk-cert.sh "$apk" "$CERT_SHA256"
          mkdir -p ../dist
          asset="denpa-${TAG#v}-android-arm64.apk"
          cp "$apk" "../dist/$asset"
          (cd ../dist && sha256sum "$asset" > "$asset.sha256")
          ls -l ../dist

      - name: Upload release APK
        if: inputs.tag != 'dev'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: denpa-android-arm64
          path: dist/
          retention-days: 7

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: android/app/build/reports/
          retention-days: 7

  # **必須チェックにはしない** (エミュレータは起動や応答の時間がばらつき、コードと関係なく落ちることがある。docs/development.md「Android のアプリ」)
  emulator:
    name: emulator (API ${{ matrix.api-level }})
    needs: app
    if: inputs.tag == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 29 は minSdk (Android 10)。35 は新しい側
        api-level: [29, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: denpa-android-debug
          path: apk

      # ffmpeg の確かめ (tests/native-smoke.ts) を 1 つのファイルにまとめ、エミュレータの中の bun で流す (.github/android-app-smoke.sh)。
      # bun のバージョンは Dockerfile から読む (test.yml と同じ)
      - name: Read bun version from Dockerfile
        id: bun
        run: echo "version=$(grep -oP 'oven/bun:\K[^-\s]+' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Bundle native-smoke
        run: bun build tests/native-smoke.ts --target=bun --outfile=smoke/native-smoke.js

      # android-emulator-runner の README のとおり
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          cores: 4
          ram-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/android-app-smoke.sh apk/app-debug.apk smoke-results smoke/native-smoke.js

      # 通っても落ちても残す (logcat・常駐サービスと通知の様子・応答)
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-smoke-${{ matrix.api-level }}
          path: smoke-results/
          retention-days: 7
