name: Mac server bundle

# **Mac (Apple Silicon) でそのまま動かす denpa 本体の配布物** (`denpa-<バージョン>-darwin-arm64.tar.gz`) を組む。
# install.sh が取りに来る。リリース (release.yml) と CI (test.yml) の両方がここを呼ぶ。作りは windows-server.yml と同じ。
#
# | 置き場      | 中身                                                                                         |
# | ----------- | -------------------------------------------------------------------------------------------- |
# | `bun`       | bun の Mac 用 (公式のリリースの `bun-darwin-aarch64.zip`。Oven の署名のまま。バージョンは Dockerfile の `oven/bun` と同じ) |
# | `app/`      | アプリ (Dockerfile の `native-files` 段)                                                     |
# | `font/`     | Denpa Font (同じ段)                                                                          |
# | `mpeg2/`    | ブラウザへ配るデコーダ (同じ段)                                                              |
# | `ffmpeg/`   | ffmpeg・ffprobe (ad-hoc 署名) とライセンスの文書 (.github/ffmpeg-macos.sh)                   |
# | `licenses/` | denpa と bun のライセンス                                                                    |
#
# ffmpeg は Mac のランナーで組む。**組んだものは actions/cache に置き、Dockerfile の ffmpeg 段と組むスクリプトが変わるまで使い回す**。
# 依存 (Opus・SVT-AV1・x264・dav1d) の組み上がりはそれぞれ別のキャッシュに置き、バージョンと組み方が変わるまで使い回す
# (ffmpeg の configure の引数だけを変えたときに、依存を組み直さない。windows-server.yml と同じ)。
# **Mac のジョブはこの 1 つだけ** (Mac のランナーは混むと待たされる)。キャッシュに当たれば、取り出して渡すだけで終わる。
#
# 組むのは呼んだ workflow のコミット (リリースならタグ)。コミットを入力で受けて取り出すことはしない (windows-server.yml の冒頭と同じ理由)

on:
  workflow_call:
    inputs:
      tag:
        description: "配布物の名前に入れるバージョン (v1.2.3 の形。v は落とす)。CI は dev"
        type: string
        default: dev

permissions:
  contents: read

jobs:
  ffmpeg:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 鍵は Dockerfile の ffmpeg 段 (土台の FROM の行は除く) と、組むスクリプトと patches/。
      # 依存の鍵はバージョンと、スクリプトの `# recipe:<名前>:begin` から `:end` までの組み方 (x264 と dav1d はバージョンも中にある)
      - name: Cache key
        id: key
        run: |
          set -euo pipefail
          stage=$(awk '/^FROM .* AS ffmpeg$/ { f = 1; next } /^FROM / { f = 0 } f' Dockerfile)
          hash=$( { printf '%s\n' "$stage"; cat .github/ffmpeg-macos.sh patches/*; } | shasum -a 256 | cut -c1-16)
          echo "key=ffmpeg-macos-arm64-$hash" >> "$GITHUB_OUTPUT"
          version() { sed -nE "s/^(ARG|ENV) $1=(.+)$/\2/p" <<< "$stage" | head -1; }
          recipe() { sed -n "/^# recipe:$1:begin/,/^# recipe:$1:end/p" .github/ffmpeg-macos.sh | shasum -a 256 | cut -c1-16; }
          # 読めなかったら止める (空のままだと、バージョンや組み方を変えても鍵が変わらない)
          for v in OPUS_VERSION SVT_AV1_VERSION; do
            test -n "$(version $v)" || { echo "Dockerfile の ffmpeg 段に $v がありません" >&2; exit 1; }
          done
          for r in opus svt-av1 x264 dav1d; do
            grep -q "^# recipe:$r:end" .github/ffmpeg-macos.sh || { echo "ffmpeg-macos.sh に recipe:$r がありません" >&2; exit 1; }
          done
          echo "opus=ffmpeg-macos-arm64-opus-$(version OPUS_VERSION)-$(recipe opus)" >> "$GITHUB_OUTPUT"
          echo "svtav1=ffmpeg-macos-arm64-svt-av1-$(version SVT_AV1_VERSION)-$(recipe svt-av1)" >> "$GITHUB_OUTPUT"
          echo "x264=ffmpeg-macos-arm64-x264-$(recipe x264)" >> "$GITHUB_OUTPUT"
          echo "dav1d=ffmpeg-macos-arm64-dav1d-$(recipe dav1d)" >> "$GITHUB_OUTPUT"

      - name: Restore ffmpeg
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffmpeg-out
          key: ${{ steps.key.outputs.key }}

      # dav1d は meson で組む。cmake はランナーに入っている
      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install meson ninja

      # 組み上がり (入れ先は .github/ffmpeg-macos.sh の `deps`)。ffmpeg が当たらなかったときだけ使う
      - name: Restore Opus
        id: opus
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-deps/opus
          key: ${{ steps.key.outputs.opus }}

      - name: Restore SVT-AV1
        id: svtav1
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-deps/svt-av1
          key: ${{ steps.key.outputs.svtav1 }}

      - name: Restore x264
        id: x264
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-deps/x264
          key: ${{ steps.key.outputs.x264 }}

      - name: Restore dav1d
        id: dav1d
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-deps/dav1d
          key: ${{ steps.key.outputs.dav1d }}

      # 依存は組み終えた直後に保存する (ffmpeg のビルドが落ちても残る)。ffmpeg 本体は成功したときだけ保存する
      - name: Build Opus
        if: steps.cache.outputs.cache-hit != 'true' && steps.opus.outputs.cache-hit != 'true'
        run: bash .github/ffmpeg-macos.sh ffmpeg-out opus

      - name: Save Opus
        if: steps.cache.outputs.cache-hit != 'true' && steps.opus.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-deps/opus
          key: ${{ steps.key.outputs.opus }}

      - name: Build SVT-AV1
        if: steps.cache.outputs.cache-hit != 'true' && steps.svtav1.outputs.cache-hit != 'true'
        run: bash .github/ffmpeg-macos.sh ffmpeg-out svt-av1

      - name: Save SVT-AV1
        if: steps.cache.outputs.cache-hit != 'true' && steps.svtav1.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-deps/svt-av1
          key: ${{ steps.key.outputs.svtav1 }}

      - name: Build x264
        if: steps.cache.outputs.cache-hit != 'true' && steps.x264.outputs.cache-hit != 'true'
        run: bash .github/ffmpeg-macos.sh ffmpeg-out x264

      - name: Save x264
        if: steps.cache.outputs.cache-hit != 'true' && steps.x264.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-deps/x264
          key: ${{ steps.key.outputs.x264 }}

      - name: Build dav1d
        if: steps.cache.outputs.cache-hit != 'true' && steps.dav1d.outputs.cache-hit != 'true'
        run: bash .github/ffmpeg-macos.sh ffmpeg-out dav1d

      - name: Save dav1d
        if: steps.cache.outputs.cache-hit != 'true' && steps.dav1d.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-deps/dav1d
          key: ${{ steps.key.outputs.dav1d }}

      - name: Build ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash .github/ffmpeg-macos.sh ffmpeg-out

      - name: Save ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffmpeg-out
          key: ${{ steps.key.outputs.key }}

      # actions/upload-artifact は実行の印 (x) を落とすので、tar に入れて渡す
      - name: Pack
        run: tar -czf ffmpeg-macos.tar.gz -C ffmpeg-out .

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-ffmpeg
          path: ffmpeg-macos.tar.gz
          retention-days: 3

  # アプリ・字・デコーダ (Dockerfile の `native-files` 段)。windows-server.yml と同じ。OS に依らないので、同じキャッシュから組む
  files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        run: |
          docker buildx build --target native-files --platform linux/amd64 \
            --cache-from "type=registry,ref=ghcr.io/${{ github.repository_owner }}/denpa:buildcache-amd64" \
            --output type=local,dest=files .
          find files -maxdepth 2 | sort

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-files
          path: files
          retention-days: 3

  bundle:
    needs: [ffmpeg, files]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download ffmpeg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-ffmpeg
          path: ffmpeg-pack

      - name: Download app files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-files
          path: files

      # bun は公式のリリース。バージョンは Dockerfile の `oven/bun` から読み、中身は同じリリースの SHASUMS256.txt で照らす。
      # Oven の署名 (Developer ID) が付いているので、署名はし直さない
      - name: Assemble
        id: tar
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bun=$(grep -oP 'oven/bun:\K[^-\s]+' Dockerfile | head -1)
          base="https://github.com/oven-sh/bun/releases/download/bun-v${bun}"
          curl -fsSL --retry 5 --retry-all-errors -o bun.zip "$base/bun-darwin-aarch64.zip"
          curl -fsSL --retry 5 --retry-all-errors -o SHASUMS256.txt "$base/SHASUMS256.txt"
          want=$(awk '$2 == "bun-darwin-aarch64.zip" { print $1 }' SHASUMS256.txt)
          test -n "$want"
          echo "$want  bun.zip" | sha256sum -c
          d=denpa
          mkdir -p "$d/licenses" "$d/ffmpeg"
          unzip -j bun.zip '*/bun' -d "$d"
          chmod 755 "$d/bun"
          curl -fsSL --retry 5 --retry-all-errors -o "$d/licenses/bun-LICENSE.md" "https://raw.githubusercontent.com/oven-sh/bun/bun-v${bun}/LICENSE.md"
          cp LICENSE "$d/licenses/denpa-LICENSE"
          cp -r files/app "$d/app"
          cp -r files/font "$d/font"
          cp -r files/mpeg2 "$d/mpeg2"
          tar -xzf ffmpeg-pack/ffmpeg-macos.tar.gz -C "$d/ffmpeg"
          for f in bun app/server.js app/build/index.js font/denpa-font.woff2 font/VERSION mpeg2/decoder.wasm ffmpeg/ffmpeg ffmpeg/ffprobe; do
            test -f "$d/$f" || { echo "$f がありません" >&2; exit 1; }
          done
          for f in bun ffmpeg/ffmpeg ffmpeg/ffprobe; do
            test -x "$d/$f" || { echo "$f が実行できません" >&2; exit 1; }
          done
          asset="denpa-${TAG#v}-darwin-arm64.tar.gz"
          tar -czf "$asset" -C "$d" .
          sha256sum "$asset" > "$asset.sha256"
          ls -la "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: denpa-darwin-arm64
          path: |
            ${{ steps.tar.outputs.asset }}
            ${{ steps.tar.outputs.asset }}.sha256
          retention-days: 7
