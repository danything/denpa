name: Publish release tags

# **バージョン番号と `latest` は、リリースを作ったときだけ動きます。**
#
# main へ入れたぶんは `develop` に積み上がるだけです
# (compose.prod.yml が指しているのが `latest` なので、入れて使っている人の
# ところで、こちらの作業中のものが勝手に動かないようにするため)。
#
# **ビルドし直しません。** リリースにしたコミットの中身から出るタグ
# (`sha-…`) は main への push のときにビルドしてあるので、そのイメージに名前を
# 貼り足すだけです。ビルドし直すと「試したものとリリースしたものが別」になります。
#
# 貼る名前は3つ。
#
# | 名前 | 例 | 動くか |
# | --- | --- | --- |
# | バージョンそのもの | `0.1.0` | **二度と動かない**。固定して使うのはこれ |
# | バージョンの系列 | `0.1` | その系列の最新に動く (0.1.1 を出せばそちらへ) |
# | `latest` | | リリースのたびに動く |
#
# **`v` は落とします** (`v0.1.0` → `0.1.0`)。git のタグには付けるのが習わしで、
# イメージのタグには付けないのが習わしなので、そのまま写さない。
#
# バージョンの名前を貼らずに `latest` だけ動かしていた頃は、**入れた人がバージョンを固定できません
# でした** — 「いま動いているもの」を指す名前しか無く、戻したいときの戻し先が
# `sha-…` (中身を最後に変えたコミット) しか無かった。
on:
  release:
    types: [published]
  # 貼り直したいときのために、手でも回せるようにしてある
  workflow_dispatch:
    inputs:
      ref:
        description: "貼る先 (タグ名かコミット)"
        required: true

permissions:
  # write は charts ジョブが Chart.yaml のバージョンを main に書き戻すため
  contents: write
  packages: write
  # 書き戻しは main へ直接 push せず、PR を出して自分でマージする (charts の最後の段)
  pull-requests: write
  # その PR に必須チェックの status を自分で付けるため (context は ruleset から引く)
  statuses: write

env:
  REGISTRY: ghcr.io

# **出したものには出所の証明 (attestation) を付けます** (actions/attest)。イメージ3つと、
# リリースに添えるエージェントの tar.gz / zip。.sha256 は同じリリースに置くので、壊れた
# ファイルは見分けられても、すり替えまでは防げない — 証明はこのリポジトリのこの workflow が
# 作ったことを Sigstore の署名で示すので、`gh attestation verify <ファイル> -R danything/denpa`
# で確かめられる (docs/install.md の「配布物を確かめる」)。
# 証明を作るジョブには `id-token` (署名の証明書を取る) と `attestations` (証明を置く) を足す。
# ジョブに permissions を書くと上の既定は丸ごと置き換わるので、要るものを全部書いてある

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      # 証明をレジストリにも置く (push-to-registry) ときに、置き場の記録を作るため
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # リリースのタグそのものを見る。既定 (トリガーしたコミット) だと、
          # タグを古いコミットに付けたときに指す先がずれる
          ref: ${{ github.event.inputs.ref || github.event.release.tag_name }}
          fetch-depth: 0

      # main の build-and-deploy と同じ出し方 (.github/image-tags.sh)。
      # ここが食い違うと、ビルドしたものと違うイメージに名前が付く
      - name: Compute image tags
        id: tag
        run: |
          . .github/image-tags.sh
          echo "agent=$AGENT_TAG" >> "$GITHUB_OUTPUT"
          echo "denpa=$DENPA_TAG" >> "$GITHUB_OUTPUT"

      # 貼る名前を決める。**x.y.z の形式でないタグにはバージョンの名前を貼らない** —
      # `nightly` のような名前をそのままイメージに貼ると、バージョンだと思って固定されてしまう。
      #
      # **プレリリース (prerelease) には `latest` を貼りません。** compose.prod.yml が
      # 指しているのがそれなので、貼ると入れて使っている人のところへ降ってしまう。
      - name: Decide names
        id: names
        run: |
          set -eu
          tag="${{ github.event.release.tag_name || github.event.inputs.ref }}"
          version="${tag#v}"
          names=""
          if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            names="$version ${version%.*}"
          fi
          if [ "${{ github.event.release.prerelease || false }}" != "true" ]; then
            names="$names latest"
          fi
          echo "list=$names" >> "$GITHUB_OUTPUT"
          echo "貼る名前: ${names:-(無し)}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # denpa もエージェントも**バージョンを 1 層足して**から名前を付ける (.github/release.Dockerfile)。
      # main で組んだイメージを土台にするので中身は同じで、増えるのは ENV の 1 枚。
      # 動いている denpa はこれで自分のバージョンを知り、新しいバージョンの通知を出す。
      # エージェントは `GET /denpa/about` で返し (agent/Denpa.Agent/About.cs)、設定の「バージョンと環境」が
      # denpa とずれていないかを見る。元のイメージが無ければここで落ちる (黙って古い latest が
      # 残るより、そのほうがいい)。
      #
      # **どちらも multi-arch のまま名前を付ける** (main は amd64 と arm64 を束ねた索引を
      # 出している)。土台の索引にある arch を全部並べて `--platform` に渡す。release.Dockerfile
      # には RUN が無いので、このランナー (amd64) で arm64 も組める — FROM で arch ごとの
      # 土台を引いて ENV を足すだけで、何も実行しない (QEMU は要らない。エージェントの土台は
      # distroless でシェルも無いが、何も実行しないので構わない)。arch を土台から
      # 読むのは、arm64 を出す前の `sha-…` を手で貼り直すとき (workflow_dispatch) に
      # 無い arch を求めて落ちないため
      - name: Point the names at this release
        id: push
        run: |
          set -eu
          base="${{ env.REGISTRY }}/${{ github.repository_owner }}"
          names="${{ steps.names.outputs.list }}"
          if [ -z "$names" ]; then
            echo "貼る名前がありません (x.y.z ではなく、プレリリースでもない)" >&2
            exit 1
          fi
          agent_args=""
          denpa_args=""
          for alias in $names; do
            agent_args="$agent_args --tag ${base}/denpa-agent:${alias}"
            denpa_args="$denpa_args --tag ${base}/denpa:${alias}"
          done
          # 土台の索引にある arch。索引でなく1枚のイメージなら manifests が無い — 以前の amd64 だけのもの
          arches() {
            found=$(docker buildx imagetools inspect --raw "$1" \
              | jq -r '[.manifests[]? | .platform | select(.os == "linux") | "linux/\(.architecture)"] | unique | join(",")')
            echo "${found:-linux/amd64}"
          }
          # push したものの digest (multi-arch の索引)。出所の証明はこれに付ける
          digest() { jq -r '."containerimage.digest"' "$1"; }
          # 土台 ($1) にバージョンを 1 層足して、名前 ($2 の --tag の並び) を付ける。結果は $3 に書く
          with_version() {
            # 単語に割りたいので引用しない (中身は上で作った名前だけ)
            # shellcheck disable=SC2086
            docker buildx build --push \
              --platform "$(arches "$1")" \
              --file .github/release.Dockerfile \
              --build-arg BASE="$1" \
              --build-arg DENPA_VERSION="${{ github.event.release.tag_name || github.event.inputs.ref }}" \
              --metadata-file "$3" \
              $2 .
          }
          with_version "${base}/denpa-agent:${{ steps.tag.outputs.agent }}" "$agent_args" agent.json
          echo "agent=$(digest agent.json)" >> "$GITHUB_OUTPUT"
          echo "denpa-agent: ${{ steps.tag.outputs.agent }} + DENPA_VERSION → $names"
          denpa_base="${base}/denpa:${{ steps.tag.outputs.denpa }}"
          platforms=$(arches "$denpa_base")
          with_version "$denpa_base" "$denpa_args" denpa.json
          echo "denpa=$(digest denpa.json)" >> "$GITHUB_OUTPUT"
          echo "denpa: ${{ steps.tag.outputs.denpa }} ($platforms) + DENPA_VERSION → $names"

          # 本体とエージェントを1つにしたもの (.github/aio.Dockerfile)。本体は、いまバージョンを
          # 足したほう (DENPA_VERSION 入り) から写す。これも写すだけなので数秒で終わる
          aio_args=""
          for alias in $names; do aio_args="$aio_args --tag ${base}/denpa-aio:${alias}"; done
          # shellcheck disable=SC2086
          set -- $names
          first="$1"
          # shellcheck disable=SC2086
          docker buildx build --push \
            --platform "$platforms" \
            --file .github/aio.Dockerfile \
            --build-arg DENPA="${base}/denpa:${first}" \
            --build-arg AGENT="${base}/denpa-agent:${{ steps.tag.outputs.agent }}" \
            --metadata-file aio.json \
            $aio_args .
          echo "aio=$(digest aio.json)" >> "$GITHUB_OUTPUT"
          echo "denpa-aio: denpa:${first} + denpa-agent:${{ steps.tag.outputs.agent }} → $names"

      # 名前ではなく digest に付ける (名前は動くので)。レジストリにも置くので、
      # `gh attestation verify oci://ghcr.io/danything/denpa:<バージョン> -R danything/denpa` で確かめられる
      - name: Attest denpa-agent
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/denpa-agent
          subject-digest: ${{ steps.push.outputs.agent }}
          push-to-registry: true

      - name: Attest denpa
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/denpa
          subject-digest: ${{ steps.push.outputs.denpa }}
          push-to-registry: true

      - name: Attest denpa-aio
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/denpa-aio
          subject-digest: ${{ steps.push.outputs.aio }}
          push-to-registry: true

  # **Mac (Apple Silicon) 用のエージェントをリリースに添える** (install.sh が取りに来る)。
  # Native AOT は Linux から macOS 向けにビルドできないので、ここだけは Mac のランナーで**ビルドする**
  # (イメージのように main でビルドしたものを使い回す先が無い)。中身はタグのコミットそのもの
  agent-macos:
    runs-on: macos-26
    permissions:
      # write はリリースに添えるため
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.event.release.tag_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"

      # 名前はタグから `v` を落としたバージョンで (denpa-agent-1.2.3-darwin-arm64.tar.gz)。
      # 中身は実行ファイル1個。.sha256 は install.sh が確かめる
      - name: Build
        id: build
        run: |
          set -eu
          tag="${{ github.event.release.tag_name || github.event.inputs.ref }}"
          # バージョンは実行ファイルに入れる (`GET /denpa/about`。agent/Denpa.Agent/About.cs)
          dotnet publish agent/Denpa.Agent/Denpa.Agent.csproj -c Release -r osx-arm64 -p:InformationalVersion="$tag" -o out
          asset="denpa-agent-${tag#v}-darwin-arm64.tar.gz"
          tar -czf "$asset" -C out denpa-agent
          shasum -a 256 "$asset" > "$asset.sha256"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      # 添える前に付ける (証明の無いものがリリースに並ばないように)
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.asset }}

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.build.outputs.tag }}
          ASSET: ${{ steps.build.outputs.asset }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

  # **Windows (x64) 用のエージェントも添える** (install.ps1 が取りに来る)。Mac と同じく、
  # Native AOT は Linux から Windows 向けにビルドできないので Windows のランナーでビルドする
  agent-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.event.release.tag_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"

      # denpa-agent-1.2.3-windows-x64.zip (中身は denpa-agent.exe 1個) と .sha256 (shasum と同じ形式)
      - name: Build
        id: build
        shell: bash
        run: |
          set -eu
          tag="${{ github.event.release.tag_name || github.event.inputs.ref }}"
          dotnet publish agent/Denpa.Agent/Denpa.Agent.csproj -c Release -r win-x64 -p:InformationalVersion="$tag" -o out
          asset="denpa-agent-${tag#v}-windows-x64.zip"
          pwsh -NoProfile -Command "Compress-Archive -Path out/denpa-agent.exe -DestinationPath '$asset'"
          sha256sum "$asset" > "$asset.sha256"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.asset }}

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.build.outputs.tag }}
          ASSET: ${{ steps.build.outputs.asset }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

  # **Helm chart もリリースのたびに出す** (README が案内している `oci://ghcr.io/danything/charts/…`)。
  # chart のバージョン (Chart.yaml の version) とアプリのバージョン (appVersion) をリリースの
  # バージョンで揃えてパッケージにし、GHCR の OCI レジストリに push する。イメージと同じく、chart 側の
  # 既定の image.tag は `latest` なので、chart のバージョンを上げなくても中身は動く —
  # バージョンで固定したい人は values で `image.denpa.tag` を書く。
  #
  # **Chart.yaml のバージョンも main に書き戻す** (最後の段)。パッケージにするときは `--version` で
  # 上書きするので動きには関係ないが、リポジトリの Chart.yaml が古いバージョンのままだと
  # 「どれが出ているのか」が読めない。build-and-deploy がイメージの印を書き戻すのと
  # 同じ手 (PR を出して自分でマージする。理由もそちらに書いてある)
  charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.event.release.tag_name }}

      - name: Decide chart version
        id: ver
        run: |
          set -eu
          tag="${{ github.event.release.tag_name || github.event.inputs.ref }}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "x.y.z の形式ではないので chart は出しません: $tag"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        if: steps.ver.outputs.skip != 'true'
        uses: azure/setup-helm@v5

      - name: Log in to GHCR (helm)
        if: steps.ver.outputs.skip != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Package and push charts
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -eu
          v="${{ steps.ver.outputs.version }}"
          for chart in charts/denpa charts/denpa-agent; do
            helm lint "$chart"
            helm package "$chart" --version "$v" --app-version "$v" --destination dist
          done
          for tgz in dist/*.tgz; do
            helm push "$tgz" "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"
          done

      # main の先頭にバージョンを書く。タグを付けたコミットではなく **いまの main** から枝を
      # 切る (その間に進んでいても、バージョンはリリースしたものが最新なので同じ)。
      # 手で回した (workflow_dispatch) ときも同じ — 貼り直しならバージョンも同じ。
      #
      # **main へは直接 push しない** (必須チェックで守ってあり、bot のトークンも
      # 素通しにならない)。PR を出し、必須チェックの status を自分で付けて、自分でマージする。
      # 中身は Chart.yaml のバージョンだけで、確かめるものは無い。手順と理由は
      # .github/bump-pr.sh (build-and-deploy と共通)
      - name: Open and self-merge a PR that writes the version back to Chart.yaml
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          v="${{ steps.ver.outputs.version }}"

          . .github/bump-pr.sh
          bump_begin bump-chart-version
          for chart in charts/denpa charts/denpa-agent; do
            sed -i -E "s#^version: .*#version: ${v}#; s#^appVersion: .*#appVersion: \"${v}\"#" "$chart/Chart.yaml"
          done
          bump_finish bump-chart-version \
            "chore: chart のバージョンを ${v} に合わせる [skip ci]" \
            "リリース ${v} のバージョンを Chart.yaml に書き戻すだけ。必須チェックが付いたら自分でマージする" \
            "Chart.yaml のバージョンだけ。chart はこの run が出した" \
            charts/*/Chart.yaml
