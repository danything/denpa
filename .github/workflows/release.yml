name: Publish release tags

# **版番号と `latest` は、リリースを作ったときだけ動きます。**
#
# main へ入れたぶんは `develop` に積み上がるだけです
# (compose.prod.yml が指しているのが `latest` なので、入れて使っている人の
# ところで、こちらの作業中のものが勝手に動かないようにするため)。
#
# **焼き直しません。** リリースにしたコミットの中身から出るタグ
# (`sha-…`) は main への push のときに焼いてあるので、そのイメージに名前を
# 貼り足すだけです。焼き直すと「試したものとリリースしたものが別」になります。
#
# 貼る名前は3つ。
#
# | 名前 | 例 | 動くか |
# | --- | --- | --- |
# | 版そのもの | `0.1.0` | **二度と動かない**。固定して使うのはこれ |
# | 版の系列 | `0.1` | その系列の最新に動く (0.1.1 を出せばそちらへ) |
# | `latest` | | リリースのたびに動く |
#
# **`v` は落とします** (`v0.1.0` → `0.1.0`)。git のタグには付けるのが習わしで、
# イメージのタグには付けないのが習わしなので、そのまま写さない。
#
# 版の名前を貼らずに `latest` だけ動かしていた頃は、**入れた人が版を固定できません
# でした** — 「いま動いているもの」を指す名前しか無く、戻したいときの戻し先が
# `sha-…` (中身を最後に変えたコミット) しか無かった。
on:
  release:
    types: [published]
  # 貼り直したいときのために、手でも回せるようにしてある
  workflow_dispatch:
    inputs:
      ref:
        description: '貼る先 (タグ名かコミット)'
        required: true

permissions:
  # write は charts ジョブが Chart.yaml の版を main に書き戻すため
  contents: write
  packages: write
  # 書き戻しは main へ直接 push せず、PR を出して自分でマージする (charts の最後の段)
  pull-requests: write
  # その PR に必須チェック (`check`) の status を自分で付けるため
  statuses: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # リリースのタグそのものを見る。既定 (トリガーしたコミット) だと、
          # タグを古いコミットに付けたときに指す先がずれる
          ref: ${{ github.event.inputs.ref || github.event.release.tag_name }}
          fetch-depth: 0

      # main の build-and-deploy と同じ出し方 (.github/image-tags.sh)。
      # ここが食い違うと、焼いたものと違うイメージに名前が付く
      - name: Compute image tags
        id: tag
        run: |
          . .github/image-tags.sh
          echo "agent=$AGENT_TAG" >> "$GITHUB_OUTPUT"
          echo "denpa=$DENPA_TAG" >> "$GITHUB_OUTPUT"

      # 貼る名前を決める。**x.y.z の形をしていないタグには版の名前を貼らない** —
      # `nightly` のような名前をそのままイメージに貼ると、版だと思って固定されてしまう。
      #
      # **試し版 (prerelease) には `latest` を貼りません。** compose.prod.yml が
      # 指しているのがそれなので、貼ると入れて使っている人のところへ降ってしまう。
      - name: Decide names
        id: names
        run: |
          set -eu
          tag="${{ github.event.release.tag_name || github.event.inputs.ref }}"
          version="${tag#v}"
          names=""
          if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            names="$version ${version%.*}"
          fi
          if [ "${{ github.event.release.prerelease || false }}" != "true" ]; then
            names="$names latest"
          fi
          echo "list=$names" >> "$GITHUB_OUTPUT"
          echo "貼る名前: ${names:-(無し)}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # エージェントは `imagetools create` — イメージを引かずに、レジストリの中で名前を
      # 足すだけ。元のイメージが無ければここで落ちる (黙って古い latest が残るより、
      # そのほうがいい)。
      #
      # denpa は**版を 1 層足して**から名前を付ける (.github/release.Dockerfile)。
      # main で組んだイメージを土台にするので中身は同じで、増えるのは ENV の 1 枚。
      # 動いている denpa はこれで自分の版を知り、新しい版の知らせを出す
      #
      # **どちらも multi-arch のまま名前を付ける** (main は amd64 と arm64 を束ねた索引を
      # 出している)。エージェントの `imagetools create` は索引ごと写すので何もしなくていい。
      # denpa は土台の索引にある arch を全部並べて `--platform` に渡す。release.Dockerfile
      # には RUN が無いので、このランナー (amd64) で arm64 も組める — FROM で arch ごとの
      # 土台を引いて ENV を足すだけで、何も実行しない (QEMU は要らない)。arch を土台から
      # 読むのは、arm64 を出す前の `sha-…` を手で貼り直すとき (workflow_dispatch) に
      # 無い arch を求めて落ちないため
      - name: Point the names at this release
        run: |
          set -eu
          base="${{ env.REGISTRY }}/${{ github.repository_owner }}"
          names="${{ steps.names.outputs.list }}"
          if [ -z "$names" ]; then
            echo "貼る名前がありません (x.y.z ではなく、試し版でもない)" >&2
            exit 1
          fi
          agent_args=""
          denpa_args=""
          for alias in $names; do
            agent_args="$agent_args --tag ${base}/denpa-agent:${alias}"
            denpa_args="$denpa_args --tag ${base}/denpa:${alias}"
          done
          # 単語に割りたいので引用しない (中身は上で作った名前だけ)
          # shellcheck disable=SC2086
          docker buildx imagetools create $agent_args "${base}/denpa-agent:${{ steps.tag.outputs.agent }}"
          echo "denpa-agent: ${{ steps.tag.outputs.agent }} → $names"
          denpa_base="${base}/denpa:${{ steps.tag.outputs.denpa }}"
          platforms=$(docker buildx imagetools inspect --raw "$denpa_base" \
            | jq -r '[.manifests[]? | .platform | select(.os == "linux") | "linux/\(.architecture)"] | unique | join(",")')
          # 索引でなく1枚のイメージなら manifests が無い — 以前の amd64 だけのもの
          platforms="${platforms:-linux/amd64}"
          # shellcheck disable=SC2086
          docker buildx build --push \
            --platform "$platforms" \
            --file .github/release.Dockerfile \
            --build-arg BASE="$denpa_base" \
            --build-arg DENPA_VERSION="${{ github.event.release.tag_name || github.event.inputs.ref }}" \
            $denpa_args .
          echo "denpa: ${{ steps.tag.outputs.denpa }} ($platforms) + DENPA_VERSION → $names"

  # **Helm chart もリリースのたびに出す** (README が案内している `oci://ghcr.io/danything/charts/…`)。
  # chart の版 (Chart.yaml の version) とアプリの版 (appVersion) をリリースの
  # 版で揃えて焼き、GHCR の OCI レジストリに push する。イメージと同じく、chart 側の
  # 既定の image.tag は `latest` なので、chart の版を上げなくても中身は動く —
  # 版で固定したい人は values で `image.denpa.tag` を書く。
  #
  # **Chart.yaml の版も main に書き戻す** (最後の段)。焼くときは `--version` で
  # 上書きするので動きには関係ないが、リポジトリの Chart.yaml が古い版のままだと
  # 「どれが出ているのか」が読めない。build-and-deploy がイメージの印を書き戻すのと
  # 同じ手 (PR を出して自分でマージする。理由もそちらに書いてある)
  charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.event.release.tag_name }}

      - name: Decide chart version
        id: ver
        run: |
          set -eu
          tag="${{ github.event.release.tag_name || github.event.inputs.ref }}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "x.y.z の形ではないので chart は出しません: $tag"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        if: steps.ver.outputs.skip != 'true'
        uses: azure/setup-helm@v5

      - name: Log in to GHCR (helm)
        if: steps.ver.outputs.skip != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Package and push charts
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -eu
          v="${{ steps.ver.outputs.version }}"
          for chart in charts/denpa charts/denpa-agent; do
            helm lint "$chart"
            helm package "$chart" --version "$v" --app-version "$v" --destination dist
          done
          for tgz in dist/*.tgz; do
            helm push "$tgz" "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"
          done

      # main の先頭に版を書く。タグを付けたコミットではなく **いまの main** から枝を
      # 切る (その間に進んでいても、版はリリースしたものが最新なので同じ)。
      # 手で回した (workflow_dispatch) ときも同じ — 貼り直しなら版も同じ。
      #
      # **main へは直接 push しない** (必須チェックで守ってあり、bot のトークンも
      # 素通しにならない)。PR を出し、`check` の status を自分で付けて、自分でマージする。
      # 中身は Chart.yaml の版だけで、確かめるものは無い。手順と理由は
      # .github/bump-pr.sh (build-and-deploy と共通)
      - name: Open and self-merge a PR that writes the version back to Chart.yaml
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          v="${{ steps.ver.outputs.version }}"

          . .github/bump-pr.sh
          bump_begin bump-chart-version
          for chart in charts/denpa charts/denpa-agent; do
            sed -i -E "s#^version: .*#version: ${v}#; s#^appVersion: .*#appVersion: \"${v}\"#" "$chart/Chart.yaml"
          done
          bump_finish bump-chart-version \
            "chore: chart の版を ${v} に合わせる [skip ci]" \
            "リリース ${v} の版を Chart.yaml に書き戻すだけ。下の check が付いたら自分でマージする" \
            "Chart.yaml の版だけ。chart はこの run が出した" \
            charts/*/Chart.yaml

  # **macOS 向けのエージェントも出す** (Homebrew。HomebrewFormula/denpa-agent.rb)。
  # 組んで formula で入れて確かめるところは PR と同じもの (macos-agent.yml) を呼ぶ
  macos-agent:
    uses: ./.github/workflows/macos-agent.yml
    with:
      tag: ${{ github.event.release.tag_name || github.event.inputs.ref }}

  # 束をリリースに載せ、formula の url / sha256 / version を書き戻す。書き戻しは charts と
  # 同じ手 (.github/bump-pr.sh)。**試し版では書き戻さない** — tap から入れている人の
  # ところへ降ってしまう (latest を貼らないのと同じ理由)
  macos-agent-release:
    needs: macos-agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the tarball
        uses: actions/download-artifact@v8
        with:
          name: macos-agent
          path: dist

      - name: Upload it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.ref }}
        run: gh release upload "$TAG" dist/*.tar.gz --clobber

      - name: Open and self-merge a PR that points the formula at this release
        if: github.event.release.prerelease != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.ref }}
          SHA256: ${{ needs.macos-agent.outputs.sha256 }}
        run: |
          set -eu
          v="${TAG#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/denpa-agent-${v}-darwin-arm64.tar.gz"

          . .github/bump-pr.sh
          bump_begin bump-formula
          sed -i -E "s#^  url .*#  url \"${url}\"#; s#^  version .*#  version \"${v}\"#; s#^  sha256 .*#  sha256 \"${SHA256}\"#" \
            HomebrewFormula/denpa-agent.rb
          bump_finish bump-formula \
            "chore: Homebrew の formula を ${v} に合わせる [skip ci]" \
            "リリース ${v} の macOS 向けの束を formula に書き戻すだけ。下の check が付いたら自分でマージする" \
            "formula の url と sha256 だけ。束はこの run が組んで確かめた" \
            HomebrewFormula/denpa-agent.rb
