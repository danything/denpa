name: Docker build check

# **Dockerfile を壊したまま main へ入れない。** イメージを組むのは main の
# build-and-deploy だけだったので、Dockerfile の誤りや arm64 だけで転ぶ依存
# (Intel の QSV は amd64 にしか無い、配布物の名前が arch で違う) は、入れてから
# デプロイが止まって初めて分かった。PR の間に両方の arch を本物のランナーで組む
# (push はしない)。
#
# **パスで絞る。** denpa のイメージは ffmpeg を組むので重い。ソースだけの PR は
# test.yml が見ていて、イメージの中身が変わるのは下のパスを触ったときだけ。
# 配布用の2つ (.github/aio.Dockerfile と release.Dockerfile。どちらも main の
# イメージに重ねるだけ) もここで組む。workflow の中でも、触ったものに要るジョブだけを
# 動かす (下の `changes`) — aio だけの PR で ffmpeg まで組まない。
#
# **ここで組めても main で落ちないとは限らない。** src だけの PR はここを通らないので、
# 起きるかどうかは build-and-deploy でも push の前に同じ .github/image-smoke.sh で見ている。
#
# **必須チェックにはしない** (ruleset に足さない)。パスで飛ばした workflow の check は
# 「保留」のまま残る仕様なので、必須にすると docs だけの PR が塞がる。ジョブの名前
# (`image (…)`) も必須の context (`check` / `agent` / `e2e (n)` / `claude-review`) と
# 重ならないようにしてある — bump の PR は GITHUB_TOKEN で開くので workflow が動かず、
# 必須の context は .github/bump-pr.sh が ruleset から引いて自分で付けている。
# ここがそれと同じ名前を名乗ると、どちらの結果か読めなくなる
on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "agent/**"
      - "patches/**"
      - "wasm/**"
      - "package.json"
      - "packages/*/package.json"
      - "bun.lock"
      # 下は runtime に個別に入るもの (Dockerfile の COPY・組み立ての設定)。E2E は手元の木で
      # 動くので、イメージに入れ忘れても PR の間は分からない
      - "server.js"
      - "src/lib/server/address.ts"
      - "src/lib/server/compress.ts"
      - "vite.config.ts"
      - "drizzle/**"
      - ".dockerignore"
      # 配布用 (下の `dist`)
      - ".github/aio.Dockerfile"
      - ".github/aio-entrypoint.ts"
      - ".github/release.Dockerfile"
      - ".github/workflows/docker-build-check.yml"
      - ".github/image-smoke.sh"
      # image-smoke がイメージの ffmpeg で確かめるもの
      - "src/lib/server/fps.ts"
      - "scripts/fps-smoke.ts"
  workflow_dispatch: {}

concurrency:
  group: docker-build-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 触ったファイルから、動かすジョブを決める。上の paths と同じものを2つに分けて並べる
  # (paths に足したら、ここにも足す)。手で回したとき (workflow_dispatch) は全部
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      images: ${{ steps.files.outputs.images }}
      dist: ${{ steps.files.outputs.dist }}
    steps:
      - name: Classify changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          if [ -z "$PR" ]; then
            echo "images=true" >> "$GITHUB_OUTPUT"
            echo "dist=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          images=false
          dist=false
          while read -r f; do
            case "$f" in
              .github/aio.Dockerfile | .github/aio-entrypoint.ts | .github/release.Dockerfile) dist=true ;;
              .github/workflows/docker-build-check.yml | .github/image-smoke.sh) images=true; dist=true ;;
              Dockerfile | agent/* | patches/* | wasm/* | package.json | packages/*/package.json | bun.lock | server.js) images=true ;;
              src/lib/server/address.ts | src/lib/server/compress.ts | vite.config.ts | drizzle/* | .dockerignore) images=true ;;
              src/lib/server/fps.ts | scripts/fps-smoke.ts) images=true ;;
            esac
          done < <(gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" --jq '.[].filename')
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "dist=$dist" >> "$GITHUB_OUTPUT"
          echo "images=$images dist=$dist"

  image:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    strategy:
      # 片方の arch が落ちても、もう片方の結果は見たい
      fail-fast: false
      matrix:
        image:
          - name: denpa-agent
            file: agent/Dockerfile
            target: ""
            scope: agent
          - name: denpa
            file: Dockerfile
            target: runtime
            scope: denpa
        arch:
          - name: amd64
            runner: ubuntu-latest
          - name: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.arch.runner }}
    name: image (${{ matrix.image.name }}, ${{ matrix.arch.name }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # キャッシュは build-and-deploy が GHCR に積んだもの (`<イメージ>:buildcache-<arch>`) を**読むだけ**
      # (main の層がそのまま効く)。イメージは公開なのでログインは要らない。
      # **書かない。** PR の層はマージした後は誰も読まず、main のキャッシュを上書きしてしまう
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.arch.name }}
          push: false
          pull: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:buildcache-${{ matrix.arch.name }}
          # 下の起動の確かめに使う。push はしないので、名前はこのジョブの中だけのもの
          load: true
          tags: smoke/${{ matrix.image.name }}

      # 組めても起こすと落ちることがある (共有ライブラリの欠け・土台の入れ替え)。
      # CI のテストはイメージを使わないので、中の ffmpeg とエージェントが動くかはここで見る
      - name: Smoke test
        run: bash .github/image-smoke.sh "${{ matrix.image.name }}" "smoke/${{ matrix.image.name }}"

      # 大きさを残す (展開後と、push したときに近い gzip の大きさ)。増減を PR で比べるため
      - name: Size
        run: |
          image="smoke/${{ matrix.image.name }}"
          echo "展開後: $(docker image inspect -f '{{.Size}}' "$image" | numfmt --to=si)B"
          echo "gzip: $(docker save "$image" | gzip | wc -c | numfmt --to=si)B"

  # 配布用の2つを、リリースのときと同じ順で重ねる (release.yml): denpa にバージョンを足して
  # (release.Dockerfile)、それにエージェントを写す (aio.Dockerfile)。土台は main で組んだ
  # 公開の `develop` — どちらも RUN の無い写すだけのものなので、引いて重ねるのに数十秒。
  # Dockerfile も一緒に変えた PR でも土台は develop のまま (組み合わせは main の aio ジョブで見る)。
  #
  # buildx の builder ではなく docker の既定の builder で組む。前の段で組んだ
  # smoke/denpa-release を、レジストリを通さずに次の FROM で使えるのはこちらだけ。
  # arch ごとに本物のランナーで組む — エージェントの置き場 (/opt/…-userland) が arch で
  # 欠けていないかもここで分かる
  dist:
    needs: changes
    if: needs.changes.outputs.dist == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: amd64
            runner: ubuntu-latest
          - name: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.arch.runner }}
    name: dist (${{ matrix.arch.name }})
    env:
      BASE: ghcr.io/${{ github.repository_owner }}
      # health が返すバージョンで、release.Dockerfile の ENV が効いているかを見る
      VERSION: v0.0.0-ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build release image
        run: |
          docker build --pull \
            --file .github/release.Dockerfile \
            --build-arg BASE="$BASE/denpa:develop" \
            --build-arg DENPA_VERSION="$VERSION" \
            --tag smoke/denpa-release .

      - name: Build aio image
        run: |
          docker build \
            --file .github/aio.Dockerfile \
            --build-arg DENPA=smoke/denpa-release \
            --build-arg AGENT="$BASE/denpa-agent:develop" \
            --tag smoke/denpa-aio .

      - name: Smoke test
        run: bash .github/image-smoke.sh denpa-aio smoke/denpa-aio "$VERSION"
