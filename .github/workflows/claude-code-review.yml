name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  claude-review:
    # Draft PR と bot (renovate/dependabot) の PR はスキップ。
    # fork からの PR も対象外 (secrets が渡らないため) —
    # そちらは claude-code-review-fork.yml がラベル起動で処理する。
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このプルリクエストをレビューしてください。回答は日本語で書いてください。

            観点:
            1. 不具合 — ロジックの誤り、null/境界値、エラーハンドリング漏れ、競合状態
            2. セキュリティ — 入力値の検証、認証・認可、シークレットの混入
            3. 設計 — 既存コードとの一貫性、重複、過剰な複雑さ
            4. テスト — 変更に対するテストの有無と質

            進め方:
            - リポジトリの規約 (CLAUDE.md / README / 周辺コード) に従うこと
            - 具体的な問題は該当行にインラインコメントを付けること
            - 全体的な所感は 1 つのトップレベルコメントにまとめること
            - 確信が持てない指摘は「要確認」と明記すること
            - 問題が無ければ簡潔に問題無しと述べること。無理に指摘を作らないこと
            - スタイルの好みだけの指摘や、変更されていない箇所の指摘はしないこと

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
