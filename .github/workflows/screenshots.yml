name: Screenshots

# README・docs の画像を撮る (scripts/capture-docs.ts。docs/development.md「README の画像」)。
# PR の CI には入れない (手で走らせるか、shots/ の枝に積んだときだけ)。
# 偽の放送 (作り物の局・番組・ロゴ・映像) の一式を立てて撮り、docs/images の画像 (静止画の webp と動く画像の avif) を artifact (shots) に上げる。
# 差し替えるときは artifact の中身を docs/images に置いてコミットする。
# names に `ui` を入れて走らせると、見た目を見比べる一揃い (主な画面 × 明暗 × デスクトップ・スマホ) を artifact (ui) に上げる
# `motion` を入れると、動きを見比べる GIF (画面の切り替え・メニューなど) を artifact (motion) に上げる
on:
  workflow_dispatch:
    inputs:
      names:
        description: 撮るものの名前 (空なら docs の画像を全部。`ui` で見比べる一揃い、`motion` で動きの GIF)
        required: false
        default: ""
  push:
    branches: ["shots/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 手元の `docker compose run --rm docs` と同じイメージ (Dockerfile の docs 段。画像に出る字と本物の ffmpeg 入り)
      - name: Build
        run: docker build --target docs -t denpa-docs .
      # node_modules はイメージの中のものを使う (名前の無いボリュームに写る)
      - name: Shoot
        env:
          NAMES: ${{ inputs.names }}
        run: docker run --rm -e TZ=Asia/Tokyo -v "$PWD:/app" -v /app/node_modules -w /app denpa-docs bun scripts/capture-docs.ts $NAMES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !contains(inputs.names, 'ui') && !contains(inputs.names, 'motion') }}
        with:
          name: shots
          path: |
            docs/images/*.webp
            docs/images/*.avif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ contains(inputs.names, 'ui') }}
        with:
          name: ui
          path: docs/images/.capture/ui/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ contains(inputs.names, 'motion') }}
        with:
          name: motion
          path: docs/images/.capture/motion/
