name: Screenshots

# README・docs の絵を撮る (scripts/capture-docs.ts。docs/development.md「README の絵」)。
# PR の CI には入れない (手で走らせるか、shots/ の枝に積んだときだけ)。
# 偽の放送 (作り物の局・番組・ロゴ・映像) の一式を立てて撮り、docs/images の webp を artifact (shots) に上げる。
# 差し替えるときは artifact の中身を docs/images に置いてコミットする
on:
  workflow_dispatch:
  push:
    branches: ['shots/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # 手元の `docker compose run --rm docs` と同じイメージ (Dockerfile の docs 段。絵に出る字と本物の ffmpeg 入り)
      - name: Build
        run: docker build --target docs -t denpa-docs .
      # node_modules はイメージの中のものを使う (名前の無いボリュームに写る)
      - name: Shoot
        run: docker run --rm -e TZ=Asia/Tokyo -v "$PWD:/app" -v /app/node_modules -w /app denpa-docs bun scripts/capture-docs.ts
      - uses: actions/upload-artifact@v7
        with:
          name: shots
          path: docs/images/*.webp
