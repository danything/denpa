name: バグ報告
description: 動かない・おかしい動きをする
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 何が起きたか
      description: 期待した動きと、実際の動き
      placeholder: 録画一覧で〜すると〜になる。〜になってほしい
    validations:
      required: true
  - type: checkboxes
    id: observed
    attributes:
      label: 実際に起きたこと
      description: コードを読んで考えた「起きうる」話は受け付けていません ([貢献の手引き](https://github.com/danything/denpa/blob/main/.github/CONTRIBUTING.md#実際に起きたことを元に))
      options:
        - label: 実機・実データで実際に起きたことを書いている (AI に調べてもらったときも、自分で確かめた)
          required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. 〜を開く
        2. 〜を押す
        3. 〜になる
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: ログ
      description: 設定の「その他」→「ログ」の「Issue にする」から開くと、伏せたサーバとエージェントのログが入ります。ほかにブラウザのコンソールなど。長ければ関係しそうなところだけ
      render: text
  - type: input
    id: version
    attributes:
      label: denpa のバージョン
      placeholder: v1.23.0
  - type: input
    id: environment
    attributes:
      label: 環境
      description: チューナー・OS・ブラウザなど、関係しそうなもの
      placeholder: PX-W3U4 / k3s / Android Chrome
