# **denpa 本体は Helm chart (charts/denpa) から出す。**
#
# bootstrap の ApplicationSet は `deploy/` を「素のマニフェストの置き場」として
# 読むので、ここに Application を 1 つ置いて chart を指させる (App-of-Apps)。
# ApplicationSet はこのファイルを素の YAML として同期し、この Application が
# chart を展開する。bootstrap 側は触らずに済む。
#
# chart に入れていないもの (この家の事情) はこの階層に素のまま残す:
#   - secrets.sops.yaml … SopsSecret (Secret denpa-oidc と VolSync の Secret)。値は SOPS で暗号化してあり、この家の事情なので chart に持たない
#   - pair.sops.yaml    … SopsSecret (Secret denpa-agent-pair)。エージェントと組む合言葉 (agent.pairSecret がこれを指す)
#   - namespace.yaml    … PSA を privileged にするラベルだけ (名前空間そのものは CreateNamespace が作る)
#   - argocd.yaml       … bootstrap の ApplicationSet が読む、この置き場の設定
#   - network-policy.yaml … CiliumNetworkPolicy。denpa に届く相手を Gateway とノードに絞る (Cilium に頼るので chart に持たない)
#
# **この家の値は下の `helm.valuesObject` にインラインで持つ。** 別ファイルにしないのは、
# ApplicationSet が `deploy/*.yaml` を全部マニフェストとして読むため (値ファイルは
# kind が無いので置けない)。chart の既定値 (charts/denpa/values.yaml) の上に重なる。
# CI は imageMarks の 2 行だけを書き換える (.github/workflows/build-and-deploy.yml)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: denpa-chart
  namespace: argocd
  annotations:
    # **差分はクライアント側で出す。** サーバ側で出すと、PVC の dataSourceRef (作ったあとは変えられない欄) を
    # 載せたまま適用を試してから比べるので、下の ignoreDifferences が効く前に毎回失敗する
    # (`spec is immutable after creation`)。比べられないと自動の同期も止まり、2026-11-10 は 01:42 (UTC) 以降の新しいイメージが入らなかった
    argocd.argoproj.io/compare-options: ServerSideDiff=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: denpa
  source:
    repoURL: https://github.com/danything/denpa.git
    targetRevision: main
    path: charts/denpa
    helm:
      releaseName: denpa
      valuesObject:
        image:
          denpa:
            # 動くタグ。入れ替えの合図は imageMarks
            tag: develop
            pullPolicy: Always
          agent:
            tag: develop
            pullPolicy: Always

        # **入れ替えの合図。** CI が「そのイメージの中身を最後に変えたコミット」を書く。
        # 手で触らない
        imageMarks:
          denpa: sha-2f187b4b7b9e
          agent: sha-b67bffc32bdb

        denpa:
          # LAN から来たときだけ何も聞かずに通す (docs/auth.md)
          trustedNetworks: 10.10.0.0/16
          # Gateway (Cilium の Envoy。hostNetwork) は Pod の網のアドレス (cilium_host) から繋いでくる
          # (実測 10.42.0.148)。ここから来たときだけ X-Forwarded-For を読む。値は Pod の網
          # (danything/gitops の talos/patches/cluster.yaml) で、同じ Gateway の後ろの
          # oauth2-proxy (bootstrap/auth/) の --trusted-proxy-ip とそろえてある
          # 網全体を信じるかわりに、denpa に届く相手を Gateway とノードに絞る (deploy/network-policy.yaml)
          trustedProxies: 10.42.0.0/16,fd42::/64
          # 同じ denpa を 2 つの名前で出しているので、ホーム画面の名前を分ける
          pwaNames: dp.doany.io=denpa,dp.l.doany.io=denpa 宅内
          # OIDC。中身は SopsSecret (deploy/secrets.sops.yaml) が作る Secret
          oidcSecretName: denpa-oidc
          # **メモリの上限は 8Gi。** ノードは 32 GB で、Forgejo の CI (dind 10Gi) と CI 以外の実使用 (約 10 GiB) と足して収める
          # (danything/gitops の docs/decisions.md「メモリを 32GB に合わせる」)。平常は 100Mi ほど (2026-11-20)。
          # ENCODE_CONCURRENCY は既定の 2 のまま。数えるのはジョブではなく ffmpeg の本数で、nice 19 で走る (docs/encode.md)。
          # GPU (Arc A310) でエンコードするので、ffmpeg 1 本のメモリは小さい。2 本のままでも上限に届かないと見た
          resources:
            limits:
              memory: 8Gi

        agent:
          # エージェントと組む合言葉。SopsSecret (deploy/pair.sops.yaml) が作る Secret を使う。
          # chart に作らせないのは、この ArgoCD が Secret を同期しない (resource.exclusions) ため。
          # 2026-11-03 にこれで chart の Secret が作られず、denpa とエージェントが起動できなかった
          pairSecret: denpa-agent-pair
          # **CPU は requests だけを付ける (CPU の limits は付けない)。** 何も付けないと BestEffort になり、cgroup の cpu.weight が 1 (いちばん低い) になる。
          # ノードが混むと、IT930x の EP 0x84 を読むスレッドが後回しにされ、出してある転送要求 (約 4 MB。CATV 5 本で約 220 ms ぶん) が埋まって
          # ブリッジのバッファが溢れるおそれがある (docs/tuner-it930x.md「TS のバッファの溢れ」)。溢れると電源を抜くまで戻らない。
          # 値は 2026-11-18 の実測から決めた。チューナー 9 台で番組表の取得とライブを回した 69 分の平均が約 24m、何もしていないときが約 0.5m。
          # 全部のチューナーで流すときのピークはその数倍と見て、200m にする。CPU の limits を付けないので、使える CPU は今と変わらない。
          # **メモリは requests と limits を付ける。** 無いと詰まったときに Talos の OOM コントローラの標的になる
          # (danything/gitops の docs/decisions.md「メモリを 32GB に合わせる」)。実測はチューナー 9 台で 94〜97Mi (2026-11-20)。
          # 転送要求のバッファはチューナー 1 台あたり数 MB なので、limits は実測の 5 倍ほどの 512Mi にする。.NET の GC は limits に合わせて動く
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              memory: 512Mi

        persistence:
          storageClassName: local-path
          # **「git で消したものは消える」を優先する** という判断
          # (danything/gitops の docs/decisions.md「PVC を守る仕掛けをやめた」)。
          # 後ろ盾は日次の restic (R2) で、復元リハーサルは通っている
          protectFromPruning: false
          # 置き場の大きさは、ノードの LVM の thin プール (約 340Gi。danything/gitops の bootstrap/storage.yaml) から
          # ほかの PVC の合計 (約 95Gi。使用量に合わせて縮めた。danything/gitops#645) を引いた残りぎりぎり。thin なので PVC の大きさを足すと実際の容量を
          # 超えられるが、超えると denpa の残量のチェック (src/lib/server/disk.ts) は PVC の大きさしか見ないので警告が出ず、
          # プールが先に埋まって全部の PVC の書き込みが止まる。だから合計がプールに収まる大きさにする。
          # raw は 5 チューナーで同時に 1 時間録ると 40 GB ほどになるので多めに取る。encoded は AV1 で 1 時間 1〜1.5 GB ほど
          # (docs/encode.md の実測) なので、170Gi で 110〜170 時間ぶん (1 日 8 時間録って 2 週間ほど)。
          # ほかの PVC を増やしたら、ここを減らす
          # 新しく作るときは VolSync が R2 の最新から中身を埋める (deploy/volsync.yaml の <PVC>-dst)。
          # raw は取っていないので付けない。今ある PVC には効かない
          data:
            dataSourceRef:
              {
                apiGroup: volsync.backube,
                kind: ReplicationDestination,
                name: denpa-data-dst,
              }
          raw:
            size: 64Gi
          encoded:
            size: 170Gi
            dataSourceRef:
              {
                apiGroup: volsync.backube,
                kind: ReplicationDestination,
                name: denpa-encoded-dst,
              }
          # 中身は数 KB だが、StorageClass が xfs で、xfs は 300 MB より小さいとフォーマットできない
          # (128Mi だと PV がマウントできず、Pod が ContainerCreating のまま止まる)
          agentConfig:
            size: 512Mi
            dataSourceRef:
              {
                apiGroup: volsync.backube,
                kind: ReplicationDestination,
                name: agent-config-dst,
              }

        # Cilium Gateway (danything/gitops の bootstrap/gateway/) に付ける。
        # dp.doany.io は `*.doany.io` の、dp.l.doany.io は `*.l.doany.io` の
        # リスナーに載るので、parentRef を 2 つに分ける (段数ごとに証明書が違うため)
        httpRoute:
          enabled: true
          # Cloudflare を通さない (映像の配信と遅延。アドレスの判定も接続元の IP に頼る)。
          # gitops は Cloudflare を通すのを基本にし、通さないものにこの注釈を付ける
          # (danything/gitops の deploy/external-dns/README.md)。ExternalDNS が proxied ではないレコードを作る
          annotations:
            external-dns.kubernetes.io/cloudflare-proxied: "false"
          parentRefs:
            - name: doany
              namespace: kube-system
              sectionName: https
            - name: doany
              namespace: kube-system
              sectionName: https-lan
          hostnames:
            - dp.doany.io
            - dp.l.doany.io
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # 素のマニフェストで入っていた同名のリソースを chart 側が引き取る
      - ServerSideApply=true
      # 下の ignoreDifferences を「比べない」だけでなく「適用でも触らない」にする
      - RespectIgnoreDifferences=true
  # **PVC の volumeName は触らない。** chart は書かないが、PV に結び付いた PVC には入っていて、
  # 一度でも ArgoCD がその欄の持ち主になると (既存の PV に結んで作り直したとき)、server-side
  # apply のたびに消しにいき、作成後は変えられない欄なので同期が毎回 PVC で落ちる。
  # 2026-10-05 にこれで新しいイメージの切り替えが止まり、宅内でも OIDC を求められた
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
        # dataSourceRef (VolSync の populator) は作るときにしか書けない。今ある PVC には当てない
        - /spec/dataSourceRef
        - /spec/dataSource
