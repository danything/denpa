# **denpa 本体は Helm chart (charts/denpa) から出す。**
#
# bootstrap の ApplicationSet は `deploy/` を「素のマニフェストの置き場」として
# 読むので、ここに Application を1つ置いて chart を指させる (App-of-Apps)。
# ApplicationSet はこのファイルを素の YAML として同期し、この Application が
# chart を展開する。bootstrap 側は触らずに済む。
#
# chart に入れていないもの (この家の事情) はこの階層に素のまま残す:
#   - oidc-secret.yaml  … InfisicalSecret。値は Infisical にあり、この家の事情なので chart に持たない
#   - namespace.yaml    … PSA を privileged にするラベルだけ (名前空間そのものは CreateNamespace が作る)
#   - argocd.yaml       … bootstrap の ApplicationSet が読む、この置き場の設定
#
# **この家の値は下の `helm.valuesObject` にインラインで持つ。** 別ファイルにしないのは、
# ApplicationSet が `deploy/*.yaml` を全部マニフェストとして読むため (値ファイルは
# kind が無いので置けない)。chart の既定値 (charts/denpa/values.yaml) の上に重なる。
# CI は imageMarks の2行だけを書き換える (.github/workflows/build-and-deploy.yml)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: denpa-chart
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: denpa
  source:
    repoURL: https://github.com/danything/denpa.git
    targetRevision: main
    path: charts/denpa
    helm:
      releaseName: denpa
      valuesObject:
        image:
          denpa:
            # 動くタグ。入れ替えの合図は imageMarks
            tag: develop
            pullPolicy: Always
          agent:
            tag: develop
            pullPolicy: Always

        # **入れ替えの合図。** CI が「そのイメージの中身を最後に変えたコミット」を書く。
        # 手で触らない
        imageMarks:
          denpa: sha-bc24300152b6
          agent: sha-9eb61aad874d

        denpa:
          # LAN から来たときだけ何も聞かずに通す (docs/auth.md)
          trustedNetworks: 10.10.0.0/16
          # Gateway (Cilium の Envoy。hostNetwork) は Pod の網の住所 (cilium_host) から繋いでくる
          # (実測 10.42.0.148)。ここから来たときだけ X-Forwarded-For を読む。値は Pod の網
          # (danything/gitops の talos/patches/cluster.yaml) で、同じ Gateway の後ろの
          # oauth2-proxy (bootstrap/auth/) の --trusted-proxy-ip とそろえてある
          trustedProxies: 10.42.0.0/16,fd42::/64
          # 同じ denpa を2つの名前で出しているので、ホーム画面の名前を分ける
          pwaNames: dp.doany.io=denpa,dp.l.doany.io=denpa 宅内
          # OIDC。中身は InfisicalSecret (deploy/oidc-secret.yaml) が Infisical から作る Secret
          oidcSecretName: denpa-oidc

        persistence:
          storageClassName: local-path
          # **「git で消したものは消える」を優先する** という判断
          # (danything/gitops の docs/decisions.md「PVC を守る仕掛けをやめた」)。
          # 後ろ盾は日次の restic (R2) で、復元リハーサルは通っている
          protectFromPruning: false

        # Cilium Gateway (danything/gitops の bootstrap/gateway/) に付ける。
        # dp.doany.io は `*.doany.io` の、dp.l.doany.io は `*.l.doany.io` の
        # リスナーに載るので、parentRef を 2 つに分ける (段数ごとに証明書が違うため)
        httpRoute:
          enabled: true
          parentRefs:
            - name: doany
              namespace: kube-system
              sectionName: https
            - name: doany
              namespace: kube-system
              sectionName: https-lan
          hostnames:
            - dp.doany.io
            - dp.l.doany.io
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # 素のマニフェストで入っていた同名のリソースを chart 側が引き取る
      - ServerSideApply=true
      # 下の ignoreDifferences を「比べない」だけでなく「適用でも触らない」にする
      - RespectIgnoreDifferences=true
  # **PVC の volumeName は触らない。** chart は書かないが、PV に結び付いた PVC には入っていて、
  # 一度でも ArgoCD がその欄の持ち主になると (既存の PV に結んで作り直したとき)、server-side
  # apply のたびに消しにいき、作成後は変えられない欄なので同期が毎回 PVC で落ちる。
  # 2026-10-05 にこれで新しいイメージの切り替えが止まり、宅内でも OIDC を求められた
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
