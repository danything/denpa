# このリポジトリを ArgoCD でどう出すか。danything/bootstrap の ApplicationSet
# (argocd/appsets/repos.yaml) が org の中からこのファイルを探し、ここに書いたとおりに
# このリポジトリの Application を作る。出し方はクラスタや bootstrap ではなく、ここで決める。
name: denpa
namespace: denpa

# マニフェストを置くディレクトリ (リポジトリの根からのパス)
sourcePath: deploy
recurse: false

# autoSync: false にすると、UI から手で同期する
autoSync: true
prune: true
selfHeal: true
