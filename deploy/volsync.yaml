# このアプリの PVC を VolSync で R2 に取る(リポジトリは PVC ごとに `<bucket>/volsync/denpa/<pvc>`)。
# その Secret(volsync-<pvc>)は secrets.sops.yaml。取り方・時刻は danything/gitops の deploy/volsync/application.yaml。アプリと一緒に置くので、
# アプリを消せばこれも消える(R2 のリポジトリは残る。要らなければ gitops の deploy/backup/README.md「やめる」)。
# PVC を足したら、ReplicationSource と secrets.sops.yaml の volsync-<pvc> を 1 組足す。
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: agent-config
  namespace: denpa
spec:
  sourcePVC: agent-config
  trigger:
    schedule: "5 19 * * *"
  restic:
    repository: volsync-agent-config
    copyMethod: Snapshot
    retain: { daily: 7, weekly: 4, monthly: 6 }
    moverSecurityContext: { runAsUser: 0, runAsGroup: 0 }
    moverResources:
      { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 1Gi } }
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: denpa-data
  namespace: denpa
spec:
  sourcePVC: denpa-data
  trigger:
    schedule: "10 19 * * *"
  restic:
    repository: volsync-denpa-data
    copyMethod: Snapshot
    retain: { daily: 7, weekly: 4, monthly: 6 }
    moverSecurityContext: { runAsUser: 0, runAsGroup: 0 }
    moverResources:
      { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 1Gi } }
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: denpa-encoded
  namespace: denpa
  annotations:
    # gitops の月次の復元チェック (deploy/backup/restore-check.yaml) で取り出さず、restic check の 1% だけにする。
    # 録画は大きく、中身は ffmpeg の出力で開いて見るものが無い
    backup.doany.io/restore-check: check-only
spec:
  sourcePVC: denpa-encoded
  trigger:
    schedule: "15 19 * * *"
  restic:
    repository: volsync-denpa-encoded
    copyMethod: Snapshot
    # 録画は 1 世代だけ(docs/decisions.md「バックアップに何を含めるか」)。中身が入れ替わるので世代を持つと消えたファイルを抱え続ける
    retain: { last: "1" }
    moverSecurityContext: { runAsUser: 0, runAsGroup: 0 }
    # restic は 1Gi だと、走り始めて 12 秒で OOMKilled になった (2026-11-20。上限を付ける前は 2 分 40 秒で終わっていた)。
    # 録画は大きく、ほかの PVC と違って 1Gi では足りない。最大のメモリ使用量は測っていないので 4Gi にして、走ったあとの使用量を見て下げる
    moverResources:
      { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 4Gi } }
---
# 戻す側(populator)。PVC agent-config の dataSourceRef がこれを指すので、PVC を新しく作ると R2 の最新から中身を埋めてから渡す
# (入れ直したクラスタ・PVC を消して作り直したとき)。今ある PVC には効かない。作られたときに 1 回だけ戻す
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: agent-config-dst
  namespace: denpa
spec:
  trigger:
    manual: restore-once
  restic:
    repository: volsync-agent-config
    copyMethod: Snapshot
    capacity: 512Mi
    accessModes: [ReadWriteOnce]
    storageClassName: local-path
    moverSecurityContext: { runAsUser: 0, runAsGroup: 0 }
    # 戻した中身はスナップショットに残るので、作業用の PVC は消す
    cleanupTempPVC: true
    cleanupCachePVC: true
---
# 戻す側(populator)。PVC denpa-data の dataSourceRef がこれを指すので、PVC を新しく作ると R2 の最新から中身を埋めてから渡す
# (入れ直したクラスタ・PVC を消して作り直したとき)。今ある PVC には効かない。作られたときに 1 回だけ戻す
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: denpa-data-dst
  namespace: denpa
spec:
  trigger:
    manual: restore-once
  restic:
    repository: volsync-denpa-data
    copyMethod: Snapshot
    capacity: 5Gi
    accessModes: [ReadWriteOnce]
    storageClassName: local-path
    moverSecurityContext: { runAsUser: 0, runAsGroup: 0 }
    # 戻した中身はスナップショットに残るので、作業用の PVC は消す
    cleanupTempPVC: true
    cleanupCachePVC: true
---
# 戻す側(populator)。PVC denpa-encoded の dataSourceRef がこれを指すので、PVC を新しく作ると R2 の最新から中身を埋めてから渡す
# (入れ直したクラスタ・PVC を消して作り直したとき)。今ある PVC には効かない。作られたときに 1 回だけ戻す
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: denpa-encoded-dst
  namespace: denpa
spec:
  trigger:
    manual: restore-once
  restic:
    repository: volsync-denpa-encoded
    copyMethod: Snapshot
    capacity: 170Gi
    accessModes: [ReadWriteOnce]
    storageClassName: local-path
    moverSecurityContext: { runAsUser: 0, runAsGroup: 0 }
    # 戻した中身はスナップショットに残るので、作業用の PVC は消す
    cleanupTempPVC: true
    cleanupCachePVC: true
