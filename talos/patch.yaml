# Talos を 1 台で denpa 用に組むパッチ。docs/install-talos.md。
#
# `talosctl gen config --config-patch @patch.yaml` に渡す。秘密 (CA・トークン) は gen config が作るので、
# ここには持たない。インストール先のディスクとイメージ (schematic.yaml) は install.sh がフラグで渡す。
#
# Talos v1.15.0-alpha.2 向け。gen config は v1alpha1 の 1 枚ではなく型付きのドキュメントの束を作り、
# 同じことを v1alpha1 側に書くと弾かれるので、全部ドキュメントで書く。ドキュメントは上から順に当たる。

# PT3 のドライバ。dvb-pt3 (schematic.yaml) は earth-pt3 を blacklist して配るので、名前を挙げて読ませる。
# 復調とチューナーのモジュール (tc90522・qm1d1c0042・mxl301rf) は、earth-pt3 が求めたときに Talos が読む
# (v1.15.0-alpha.2 から) ので挙げなくてよい。
apiVersion: v1alpha1
kind: KernelModuleConfig
name: earth-pt3
---
# 1 台なので、control-plane に付く NoSchedule を外して denpa を載せる。
# taints はマップなので `{}` を書いても消えない。ドキュメントごと消して labels だけ書き戻す。
apiVersion: v1alpha1
kind: KubeNodeConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeNodeConfig
# 消したままだと kubectl get nodes の ROLES が <none> になる
labels:
  node-role.kubernetes.io/control-plane: ""
  node.kubernetes.io/exclude-from-external-load-balancers: ""
---
# ディスクの割り方。既定では EPHEMERAL (/var。イメージやログ) がディスクを全部取る。
# 64GiB で頭を打たせ、残りを録画と DB の置き場 (下の local-path-provisioner) に回す。
# ボリュームの設定は、まだ切っていないときにしか効かない (入れたあとに変えるなら入れ直し)。
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  maxSize: 64GiB
  grow: true
---
# 録画と DB の置き場。/var/mnt/local-path-provisioner に付く。
# 別のディスクに置くなら diskSelector を `disk.dev_path == "/dev/sdb"` のように変える。
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-path-provisioner
provisioning:
  diskSelector:
    match: system_disk
  minSize: 50GiB
  grow: true
---
# Talos には PVC を作るものが無いので、local-path-provisioner を入れる。Talos が bootstrap のときに当てる
# (Talos のドキュメントの「local storage」と同じ形。置き場を上のボリュームに向け、namespace を privileged にする)。
# 元は https://github.com/rancher/local-path-provisioner の deploy/local-path-storage.yaml。
# StorageClass は既定にし、PVC を消しても中身は消さない (Retain。録画が消えないように)。
apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: local-path-provisioner
manifest: |-
  apiVersion: v1
  kind: Namespace
  metadata:
    name: local-path-storage
    labels:
      # ヘルパーの Pod が hostPath を使う。Talos の Pod Security Admission の既定 (baseline) では通らない
      pod-security.kubernetes.io/enforce: privileged
  ---
  apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: local-path-provisioner-service-account
    namespace: local-path-storage
  ---
  apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata:
    name: local-path-provisioner-role
    namespace: local-path-storage
  rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  ---
  apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRole
  metadata:
    name: local-path-provisioner-role
  rules:
    - apiGroups: [""]
      resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["persistentvolumes"]
      verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
    - apiGroups: [""]
      resources: ["events"]
      verbs: ["create", "patch"]
    - apiGroups: ["storage.k8s.io"]
      resources: ["storageclasses"]
      verbs: ["get", "list", "watch"]
  ---
  apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: local-path-provisioner-bind
    namespace: local-path-storage
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: local-path-provisioner-role
  subjects:
    - kind: ServiceAccount
      name: local-path-provisioner-service-account
      namespace: local-path-storage
  ---
  apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRoleBinding
  metadata:
    name: local-path-provisioner-bind
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: local-path-provisioner-role
  subjects:
    - kind: ServiceAccount
      name: local-path-provisioner-service-account
      namespace: local-path-storage
  ---
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: local-path-provisioner
    namespace: local-path-storage
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: local-path-provisioner
    template:
      metadata:
        labels:
          app: local-path-provisioner
      spec:
        serviceAccountName: local-path-provisioner-service-account
        containers:
          - name: local-path-provisioner
            # renovate: datasource=docker depName=docker.io/rancher/local-path-provisioner
            image: docker.io/rancher/local-path-provisioner:v0.0.37
            imagePullPolicy: IfNotPresent
            command:
              - local-path-provisioner
              - --debug
              - start
              - --config
              - /etc/config/config.json
            ports:
              - name: health
                containerPort: 8080
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: health
              initialDelaySeconds: 5
              periodSeconds: 5
              failureThreshold: 12
            livenessProbe:
              httpGet:
                path: /health
                port: health
              initialDelaySeconds: 10
              periodSeconds: 10
            readinessProbe:
              httpGet:
                path: /ready
                port: health
              initialDelaySeconds: 5
              periodSeconds: 5
            volumeMounts:
              - name: config-volume
                mountPath: /etc/config/
            env:
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: CONFIG_MOUNT_PATH
                value: /etc/config/
              - name: HEALTH_PORT
                value: "8080"
        volumes:
          - name: config-volume
            configMap:
              name: local-path-config
  ---
  apiVersion: storage.k8s.io/v1
  kind: StorageClass
  metadata:
    name: local-path
    annotations:
      storageclass.kubernetes.io/is-default-class: "true"
  provisioner: rancher.io/local-path
  volumeBindingMode: WaitForFirstConsumer
  reclaimPolicy: Retain
  ---
  kind: ConfigMap
  apiVersion: v1
  metadata:
    name: local-path-config
    namespace: local-path-storage
  data:
    config.json: |-
      {
        "nodePathMap": [
          {
            "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
            "paths": ["/var/mnt/local-path-provisioner"]
          }
        ]
      }
    setup: |-
      #!/bin/sh
      set -eu
      mkdir -m 0777 -p "$VOL_DIR"
    teardown: |-
      #!/bin/sh
      set -eu
      rm -rf "$VOL_DIR"
    helperPod.yaml: |-
      apiVersion: v1
      kind: Pod
      metadata:
        name: helper-pod
      spec:
        priorityClassName: system-node-critical
        tolerations:
          - key: node.kubernetes.io/disk-pressure
            operator: Exists
            effect: NoSchedule
        containers:
          - name: helper-pod
            image: docker.io/library/busybox
            imagePullPolicy: IfNotPresent
---
# denpa の namespace。denpa と tuner-agent は privileged で hostPath (/dev/dvb・/dev/bus・/dev/dri) を使うので、
# Pod Security Admission を privileged にしておく (deploy/namespace.yaml と同じ)。
# helm install より先に、bootstrap のときに Talos が作る。
apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: denpa-namespace
manifest: |-
  apiVersion: v1
  kind: Namespace
  metadata:
    name: denpa
    labels:
      pod-security.kubernetes.io/enforce: privileged
      pod-security.kubernetes.io/audit: privileged
      pod-security.kubernetes.io/warn: privileged
